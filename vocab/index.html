<title>영단어 시험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 밝은 회색 바탕에 흰 카드, 강조색은 남색 하나. 학습 앱처럼 큰 버튼·큰 숫자 */
:root{
  color-scheme:light;
  --bg:#F4F5F8; --card:#FFFFFF; --ink:#171A23; --text:#4B5263; --muted:#6B7280; --faint:#9AA0AC;
  --line:#E6E8EE; --soft:#F4F5F8; --track:#EDEFF3;
  --accent:#3D4BD1; --accent-soft:#ECEEFC; --dark:#171A23;
  --ok:#1F7A4D; --ok-line:#2E9E64; --ok-soft:#EAF7F0; --done-soft:#E3F4EA;
  --bad:#B42318; --bad-line:#D14343; --bad-soft:#FDECEC;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0F1117; --card:#1A1D26; --ink:#F2F3F7; --text:#C5C9D3; --muted:#9AA0AC; --faint:#6B7280;
  --line:#2C303C; --soft:#232733; --track:#2C303C;
  --accent:#7C87F0; --accent-soft:#262B4D; --dark:#F2F3F7;
  --ok:#5BD08F; --ok-line:#3DAA6C; --ok-soft:#173326; --done-soft:#173326;
  --bad:#FF8A80; --bad-line:#E06060; --bad-soft:#3A1E1E;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1117; --card:#1A1D26; --ink:#F2F3F7; --text:#C5C9D3; --muted:#9AA0AC; --faint:#6B7280;
  --line:#2C303C; --soft:#232733; --track:#2C303C;
  --accent:#7C87F0; --accent-soft:#262B4D; --dark:#F2F3F7;
  --ok:#5BD08F; --ok-line:#3DAA6C; --ok-soft:#173326; --done-soft:#173326;
  --bad:#FF8A80; --bad-line:#E06060; --bad-soft:#3A1E1E;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);padding-inline:16px;padding-block:20px 40px;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2{margin:0;font-weight:700;text-wrap:balance}
h1{font-size:26px;letter-spacing:-.5px}
h2{font-size:15px;font-weight:600}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 4px 4px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}
.chip{font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:999px;white-space:nowrap}
.status{font-size:13px;color:var(--muted);min-height:18px;padding:0 4px}
.status.err{color:var(--bad)}
.card{background:var(--card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:14px;line-height:1.55}
.btn{height:54px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;padding:0 20px;width:100%}
.btn.dark{background:var(--dark);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
.ghost{height:50px;border:0;border-radius:14px;background:transparent;color:var(--text);font-size:15px;font-weight:500;padding:0 16px}
.sub-btn{height:46px;border:0;border-radius:12px;background:var(--soft);color:var(--text);font-size:15px;font-weight:600;padding:0 16px}
.acts{display:flex;gap:8px}
.acts>*{flex:1}
.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .25s}

/* 다음 세트 */
.big{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1.1;font-variant-numeric:tabular-nums}

/* 오답 노트 줄 */
.listrow{background:var(--card);border:0;border-radius:20px;padding:16px 20px;display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.listrow:disabled{cursor:default}
.listrow .ico{width:40px;height:40px;border-radius:12px;background:var(--bad-soft);display:grid;place-items:center;flex:none}
.listrow .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.listrow .tx b{font-size:15px;font-weight:600;color:var(--ink)}
.listrow .tx span{font-size:13px;color:var(--muted)}

/* Day 고르기 */
.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:360px){.days{grid-template-columns:repeat(5,minmax(0,1fr))}}
.day{border:0;background:var(--soft);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:0;min-height:48px;justify-content:center}
.day b{font-size:15px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.day small{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.day.cleared{background:var(--done-soft)}
.day.cleared b,.day.cleared small{color:var(--ok)}
.day.today-set{box-shadow:inset 0 0 0 2px var(--accent)}
.day[aria-pressed="true"]{background:var(--accent)}
.day[aria-pressed="true"] b,.day[aria-pressed="true"] small{color:#fff}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* 시험 */
.sheet{background:var(--card);border-radius:24px;padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 60px)}
.qtop{display:flex;align-items:center;gap:12px}
.qtop .bar{flex:1}
.icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;flex:none}
.qcount{font-size:14px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.qhead{padding:40px 0 32px;display:flex;flex-direction:column;align-items:center;gap:12px}
.pill{font-size:13px;font-weight:600;color:var(--muted);background:var(--soft);padding:5px 12px;border-radius:999px}
.word{font-size:40px;font-weight:700;letter-spacing:-1px;text-align:center;overflow-wrap:anywhere;line-height:1.15}
.choices{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.choice{width:100%;min-height:58px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);display:flex;align-items:center;gap:14px;text-align:left;font-size:16px;color:var(--ink)}
.choice .k{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;background:var(--soft);color:var(--muted)}
.choice:hover:not(:disabled){border-color:var(--faint)}
.choice.right{border-color:var(--ok-line);background:var(--ok-soft);font-weight:600}
.choice.right .k{background:var(--ok-line);color:#fff}
.choice.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.choice.wrong .k{background:var(--bad-line);color:#fff}
.choice:disabled{cursor:default}
.feedback{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:10px;min-height:118px;justify-content:flex-end}
.feedback .msg{font-size:15px;font-weight:600}
.feedback .msg.ok{color:var(--ok)}
.feedback .msg.bad{color:var(--bad)}

/* 결과 */
.result-top{background:var(--card);border-radius:24px;padding:40px 24px 28px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.score{font-size:56px;font-weight:700;letter-spacing:-2px;line-height:1.1;font-variant-numeric:tabular-nums}
.score small{font-size:24px;color:var(--faint);font-weight:600;letter-spacing:0}
.wrongs{list-style:none;margin:0;padding:0;background:var(--card);border-radius:20px;overflow:hidden}
.wrongs li{padding:14px 20px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--track)}
.wrongs li:last-child{border-bottom:0}
.wrongs b{font-size:17px;font-weight:600}
.wrongs span{font-size:14px;color:var(--text)}
.stack{display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
      <span class="eyebrow" id="subLine">Word Master 하이스트</span>
      <h1>영단어</h1>
    </div>
    <span class="chip" id="todayDate"></span>
  </header>
  <div class="status" id="status" role="status">단어를 불러오는 중…</div>

  <!-- 처음 화면 -->
  <div id="home" class="wrap" style="max-width:none">
    <section class="card" aria-labelledby="h-today">
      <div class="row"><h2 id="h-today" style="color:var(--muted);font-weight:500;font-size:14px">다음 세트</h2></div>
      <div class="big" id="todayDays">Day –</div>
      <div class="muted" id="todayNote"></div>
      <div class="muted" id="todayBest"></div>
      <button class="btn" id="startToday" type="button" disabled>시작하기</button>
    </section>

    <section class="card" aria-label="전체 진도" style="padding:18px 20px;gap:12px">
      <div class="row"><h2>전체 진도</h2><span class="muted" id="progLine" style="font-variant-numeric:tabular-nums"></span></div>
      <div class="bar" aria-hidden="true"><i id="todayBar" style="width:0%"></i></div>
    </section>

    <button class="listrow" id="startWrong" type="button" disabled>
      <span class="ico" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D14343" stroke-width="2" stroke-linecap="round"><path d="M4 5h16M4 12h10M4 19h7"/></svg></span>
      <span class="tx"><b>오답 노트</b><span>틀린 단어 <span id="wrongCount" style="font-size:inherit">0단어</span> · 다시 맞히면 빠져요</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9AA0AC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>

    <section class="card" aria-labelledby="h-days">
      <div class="row"><h2 id="h-days">Day 골라서 보기</h2><span class="muted" id="pickCount" style="font-size:13px">여러 개를 고를 수 있어요</span></div>
      <div class="days" id="days"></div>
      <div class="legend"><span><i style="background:var(--done-soft)"></i>끝낸 Day</span><span><i style="box-shadow:inset 0 0 0 2px var(--accent)"></i>다음 세트</span></div>
      <div class="acts"><button class="btn" id="startPicked" type="button" disabled>선택한 Day로 시험</button><button class="sub-btn" id="clearPick" type="button" style="flex:0 0 auto;height:54px">선택 해제</button></div>
    </section>
  </div>

  <!-- 시험 화면 -->
  <section id="quiz" class="sheet" hidden aria-label="시험">
    <div class="qtop">
      <button class="icon-btn" id="quit" type="button" aria-label="그만하기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="bar" aria-hidden="true"><i id="qBar" style="width:0%"></i></div>
      <span class="qcount" id="qCount"></span>
    </div>
    <div class="qhead">
      <span class="pill" id="qMeta"></span>
      <div class="word" id="qWord" lang="en"></div>
      <span class="muted">알맞은 뜻을 고르세요</span>
    </div>
    <ol class="choices" id="choices"></ol>
    <div class="feedback"><span class="msg" id="qMsg" aria-live="polite"></span><button class="btn dark" id="next" type="button" hidden>다음</button></div>
  </section>

  <!-- 결과 화면 -->
  <div id="done" class="wrap" hidden style="max-width:none">
    <section class="result-top" aria-labelledby="h-done">
      <h2 id="h-done" style="color:var(--muted);font-size:14px">시험 결과</h2>
      <div class="score" id="dScore"></div>
      <div class="muted" id="dNote"></div>
    </section>
    <ul class="wrongs" id="dWrongs"></ul>
    <div class="stack"><button class="btn" id="nextSet" type="button" hidden>다음 세트 바로 시작</button><button class="btn" id="retryWrong" type="button">틀린 것만 다시 풀기</button><button class="ghost" id="toHome" type="button">처음으로</button></div>
  </div>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const WD=['일','월','화','수','목','금','토'];
const PER_DAY=2;                   // 한 세트 = Day 2개
let DAYS=14;                       // 들어 있는 마지막 Day (단어를 불러오면 갱신)
const sets=()=>Math.ceil(DAYS/PER_DAY);
const setDays=k=>[k*PER_DAY+1,k*PER_DAY+2].filter(d=>d<=DAYS);
let db=null;
let words=[];                      // {n,w,m,day}
let stats={};                      // n -> {c:맞힌 수, x:틀린 수, last:1|0}
let best={};                       // 'd1-2' -> 최고 점수(%)
let cleared={};                    // Day -> 끝낸 날짜 (세트를 틀린 것까지 다 맞히면)
let picked=new Set();
let Q=null;                        // 진행 중인 시험

function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmt(s){const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setStatus(t,err){const el=$('#status');el.textContent=t;el.className='status'+(err?' err':'')}
function today(){return ymd(new Date())}

/* 뜻의 첫머리로 품사를 대강 가른다: 오답 보기를 같은 품사에서 뽑아 헷갈리게 */
function kind(m){
  const head=m.split(/[;,]/)[0].replace(/\(.*?\)|\[.*?\]/g,'').trim();
  if(/다$/.test(head))return 'v';
  if(/(한|인|의|운|은|는|된|적|없는|있는|많은|쉬운|어려운|깊은|높은)$/.test(head))return 'a';
  return 'n';
}

/* 마지막으로 끝낸 Day 다음 세트. 날짜와 상관없이 끝내는 대로 넘어간다 */
function nextSet(){
  const last=Math.max(0,...Object.keys(cleared).map(Number));
  let k=Math.floor(Math.max(0,last-1)/PER_DAY);
  if(setDays(k).every(d=>cleared[d]))k++;
  return k<sets()?{k,days:setDays(k)}:null;
}
function setKey(days){return 'd'+days.join('-')}
function dayAcc(d){
  const ws=words.filter(w=>w.day===d);let seen=0,ok=0;
  ws.forEach(w=>{const s=stats[w.n];if(s){seen++;if(s.last)ok++}});
  return seen?Math.round(ok/ws.length*100):null;
}
function wrongList(){return words.filter(w=>stats[w.n]&&stats[w.n].last===0)}

/* ---------- 처음 화면 ---------- */
function renderHome(){
  const t=nextSet(), doneAll=Object.keys(cleared).length, doneToday=Object.values(cleared).filter(d=>d===today()).length;
  if(!t){$('#todayDays').textContent='끝!';$('#todayNote').textContent='Day 1–'+DAYS+'를 모두 끝냈어요. 오답 노트나 Day를 골라 다시 보세요.';$('#startToday').disabled=true}
  else{$('#todayDays').textContent='Day '+t.days.join(' · ');$('#startToday').textContent='시작하기 · '+t.days.length*30+'문제';$('#todayNote').textContent='틀린 단어까지 다시 풀어 다 맞히면 바로 다음 세트로 넘어가요.';$('#startToday').disabled=!words.length}
  $('#todayDate').textContent=`오늘 ${doneToday} Day 끝냄`;
  const days=t?t.days:null;
  const b=days?best[setKey(days)]:null;
  $('#todayBar').style.width=(DAYS?doneAll/DAYS*100:0)+'%';
  $('#progLine').textContent=doneAll+' / '+DAYS+' Day';
  $('#todayBest').textContent=days&&b!=null?'이 세트 최고 점수 '+b+'점':'';
  const todayDays=new Set(days||[]);
  $('#days').innerHTML=Array.from({length:DAYS},(_,i)=>{const d=i+1,a=dayAcc(d);
    return `<button type="button" class="day${todayDays.has(d)?' today-set':''}${cleared[d]?' cleared':''}" data-day="${d}" aria-pressed="${picked.has(d)}"><b>${d}</b><small>${cleared[d]?'✓':''}${a==null?'':(cleared[d]?' ':'')+a+'%'}</small></button>`}).join('');
  $('#pickCount').textContent=picked.size?`Day ${[...picked].sort((a,b)=>a-b).join(', ')} · ${picked.size*30}문제`:'여러 개를 고를 수 있어요';
  $('#startPicked').disabled=!picked.size||!words.length;
  const wl=wrongList();
  $('#wrongCount').textContent=wl.length+'단어';
  $('#startWrong').disabled=!wl.length;
}
function show(id){['#home','#quiz','#done'].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0)}

/* ---------- 시험 ---------- */
// goal: 이 시험으로 끝내려는 Day들(틀린 것 다시 풀기에도 이어진다)
function start(list,label,key,days,goal){
  if(!list.length)return;
  const pool=list.length>=12?list:words;   // 보기 뽑을 뜻 모음
  Q={label,key,days:days||null,setDays:goal||days||null,items:shuffle(list).map(w=>({w,choices:makeChoices(w,pool)})),i:0,right:0,wrong:[],answers:{}};
  show('#quiz');renderQ();
}
function makeChoices(w,pool){
  const k=kind(w.m);
  const others=shuffle(pool.filter(x=>x.n!==w.n&&x.m!==w.m));
  const same=others.filter(x=>kind(x.m)===k), rest=others.filter(x=>kind(x.m)!==k);
  const pick=[];const seen=new Set([w.m]);
  for(const x of [...same.slice(0,3),...rest,...same.slice(3)]){if(pick.length>=4)break;if(!seen.has(x.m)){seen.add(x.m);pick.push(x.m)}}
  return shuffle([w.m,...pick]);
}
function renderQ(){
  const it=Q.items[Q.i];
  $('#qWord').textContent=it.w.w;
  $('#qMeta').textContent='Day '+it.w.day;
  $('#qCount').textContent=(Q.i+1)+' / '+Q.items.length;
  $('#qBar').style.width=(Q.i/Q.items.length*100)+'%';
  $('#choices').innerHTML=it.choices.map((m,j)=>`<li><button type="button" class="choice" data-j="${j}"><span class="k">${j+1}</span><span>${esc(m)}</span></button></li>`).join('');
  $('#qMsg').textContent='';$('#qMsg').className='msg';$('#next').hidden=true;
}
let advanceTimer=null;
function answer(j){
  const it=Q.items[Q.i];if(it.done)return;it.done=true;
  const ok=it.choices[j]===it.w.m;
  const btns=[...document.querySelectorAll('.choice')];
  btns.forEach((b,k)=>{b.disabled=true;if(it.choices[k]===it.w.m)b.classList.add('right')});
  Q.answers[it.w.n]=ok?1:0;
  if(ok){Q.right++;$('#qMsg').textContent='정답이에요';$('#qMsg').className='msg ok';advanceTimer=setTimeout(next,650)}
  else{btns[j].classList.add('wrong');Q.wrong.push(it.w);$('#qMsg').textContent='정답은 '+(it.choices.indexOf(it.w.m)+1)+'번이에요';$('#qMsg').className='msg bad';$('#next').hidden=false;$('#next').focus()}
}
function next(){clearTimeout(advanceTimer);Q.i++;if(Q.i>=Q.items.length)finish();else renderQ()}
async function finish(quit){
  const answered=Object.keys(Q.answers).length;
  const total=quit?answered:Q.items.length;
  show('#done');
  const pct=total?Math.round(Q.right/total*100):0;
  $('#dScore').innerHTML=`${Q.right}<small> / ${total}</small>`;
  $('#dNote').textContent=total?(quit?'중간에 그만둔 시험이에요. 푼 문제만 기록했어요.':`${pct}점 · ${Q.label}`):'푼 문제가 없어요.';
  $('#dWrongs').innerHTML=Q.wrong.length?Q.wrong.map(w=>`<li><b lang="en">${esc(w.w)}</b><span>${esc(w.m)}</span></li>`).join(''):(total?'<li><b>모두 맞혔어요</b><span>틀린 단어가 없어요.</span></li>':'');
  $('#retryWrong').hidden=!Q.wrong.length;
  $('#nextSet').hidden=true;
  const sd=Q.setDays&&Q.setDays.join('·');
  if(!quit&&Q.setDays&&!Q.wrong.length){
    Q.setDays.forEach(d=>{if(!cleared[d])cleared[d]=today()});
    const n=nextSet();
    $('#dNote').textContent=`Day ${sd} 끝! `+(n?`다음은 Day ${n.days.join('·')}`:'모든 Day를 끝냈어요');
    $('#nextSet').hidden=!n;
  }else if(!quit&&Q.setDays&&Q.wrong.length){
    $('#dNote').textContent+=` · 틀린 ${Q.wrong.length}개를 다시 풀어 다 맞히면 Day ${sd} 끝`;
  }
  if(!answered)return;
  // 기록: 단어별 결과 한 번에, 세트 최고 점수, 시험 기록
  Object.entries(Q.answers).forEach(([n,ok])=>{const s=stats[n]||{c:0,x:0,last:null};stats[n]={c:s.c+(ok?1:0),x:s.x+(ok?0:1),last:ok}});
  if(!quit&&Q.key&&(best[Q.key]==null||pct>best[Q.key]))best[Q.key]=pct;
  if(!db){setStatus('저장소에 연결되지 않아 기록을 남기지 못했어요.',true);return}
  try{
    await db.doc('progress/main').set({stats,best,cleared,updatedAt:new Date().toISOString()});
    await db.collection('sessions').add({at:new Date().toISOString(),date:today(),label:Q.label,days:Q.days,right:Q.right,total,quit:!!quit});
    setStatus('기록을 저장했어요');
  }catch(e){setStatus('기록을 저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.',true)}
}

/* ---------- 이벤트 ---------- */
$('#days').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(!b)return;const d=Number(b.dataset.day);picked.has(d)?picked.delete(d):picked.add(d);renderHome()});
$('#clearPick').addEventListener('click',()=>{picked.clear();renderHome()});
function startNext(){const t=nextSet();if(!t)return;start(words.filter(w=>t.days.includes(w.day)),'Day '+t.days.join(' · '),setKey(t.days),t.days)}
$('#startToday').addEventListener('click',startNext);
$('#nextSet').addEventListener('click',startNext);
$('#startPicked').addEventListener('click',()=>{const days=[...picked].sort((a,b)=>a-b);start(words.filter(w=>picked.has(w.day)),'Day '+days.join(' · '),days.length===2&&days[1]===days[0]+1&&days[0]%2===1?setKey(days):null,days)});
$('#startWrong').addEventListener('click',()=>start(wrongList(),'오답 노트',null));
$('#choices').addEventListener('click',e=>{const b=e.target.closest('.choice');if(b)answer(Number(b.dataset.j))});
$('#next').addEventListener('click',next);
$('#quit').addEventListener('click',()=>{clearTimeout(advanceTimer);finish(true)});
$('#retryWrong').addEventListener('click',()=>{const w=Q.wrong.slice();start(w,'틀린 것 다시',null,null,Q.setDays)});
$('#toHome').addEventListener('click',()=>{show('#home');renderHome()});
document.addEventListener('keydown',e=>{
  if($('#quiz').hidden||e.target.closest('input'))return;
  if(/^[1-5]$/.test(e.key)){const b=document.querySelectorAll('.choice')[Number(e.key)-1];if(b&&!b.disabled)b.click()}
  else if(e.key==='Enter'&&!$('#next').hidden){e.preventDefault();next()}
});
renderHome();

/* ---------- 데이터 ---------- */
(async()=>{
  db=await (window.claude?.use?.('db')??null);
  if(!db){setStatus('저장소를 쓸 수 없는 화면이에요. claude.ai에서 열어 주세요.',true);return}
  try{
    const [ws,pg]=await Promise.all([db.collection('words').get(),db.doc('progress/main').get()]);
    words=ws.docs.flatMap(d=>{const x=d.data();return (x.words||[]).map(w=>({...w,day:x.day}))}).sort((a,b)=>a.n-b.n);
    if(pg.exists){const p=pg.data();stats=p.stats||{};best=p.best||{};cleared=p.cleared||{}}
    if(words.length)DAYS=Math.max(...words.map(w=>w.day));
    $('#subLine').textContent=`Word Master 하이스트 · ${words.length}단어`;
    setStatus(words.length?`${words.length}단어를 불러왔어요`:'단어가 아직 없어요.',!words.length);
    renderHome();
  }catch(e){setStatus('단어를 불러오지 못했어요. 새로고침해 주세요.',true)}
})();
})();
</script>
