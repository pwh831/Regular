<title>복습 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#EEF1F5; --paper:#FFFFFF; --ink:#18212E; --muted:#5E6A7B; --line:#D9DFE7;
  --pen:#2457C5; --pen-soft:#E3EAFA; --hl:#FFE36B; --hl-ink:#3D3300;
  --late:#C2412D; --late-soft:#FBE7E3; --ok:#23845A; --ok-soft:#E1F3EA;
  --s1:#2F7BD9; --s2:#D9483B; --s3:#2E9C6A; --s4:#9A55C9; --s5:#D98A1F; --s6:#1F9AA8;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#12161D; --paper:#1A2029; --ink:#E7ECF3; --muted:#9AA5B5; --line:#2C3542;
  --pen:#7EA4F2; --pen-soft:#233252; --hl:#6B5A10; --hl-ink:#FFF1B0;
  --late:#F08A77; --late-soft:#3B221E; --ok:#6CCB9D; --ok-soft:#18342A;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12161D; --paper:#1A2029; --ink:#E7ECF3; --muted:#9AA5B5; --line:#2C3542;
  --pen:#7EA4F2; --pen-soft:#233252; --hl:#6B5A10; --hl-ink:#FFF1B0;
  --late:#F08A77; --late-soft:#3B221E; --ok:#6CCB9D; --ok-soft:#18342A;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.status{font-size:12px;color:var(--muted)}
.status.err{color:var(--late)}

/* D-day strip */
.dday{display:flex;gap:10px;flex-wrap:wrap}
.dcard{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px;min-width:0}
.dcard .dot{width:10px;height:10px;border-radius:50%;flex:none}
.dcard .num{font-family:var(--mono);font-weight:600;font-size:20px}
.dcard .nm{font-weight:500}
.dcard .dt{font-size:12px;color:var(--muted)}
.dcard.none .num{color:var(--muted);font-size:14px}

.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* review list */
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:9px;border:1px solid var(--line)}
.rv.done{opacity:.55}
.rv.done .ttl{text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.chk svg{width:16px;height:16px;opacity:0}
.rv.done .chk{background:var(--ok);border-color:var(--ok)}
.rv.done .chk svg{opacity:1}
.ttl{font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted);margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.tag i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;letter-spacing:.02em}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.round{background:var(--pen-soft);color:var(--pen)}
.pips{display:flex;gap:3px}
.pips b{width:14px;height:5px;border-radius:3px;background:var(--line)}
.pips b.f{background:var(--ok)}
.pips b.c{background:var(--pen)}
a.quiz{font-size:12px;color:var(--pen);text-decoration:none;white-space:nowrap;border:1px solid var(--pen-soft);padding:4px 8px;border-radius:7px}
a.quiz:hover{background:var(--pen-soft)}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:9px;text-align:center}
.summary{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.summary strong{color:var(--ink);font-family:var(--mono)}

/* form */
form.add{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
form.add .full{grid-column:1/-1}
@media (max-width:480px){form.add{grid-template-columns:minmax(0,1fr)}}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;width:100%;min-width:0}
.preview{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.preview .d{font-family:var(--mono);background:var(--pen-soft);color:var(--pen);border-radius:5px;padding:1px 6px}
.preview .d.x{background:transparent;color:var(--muted);text-decoration:line-through}
.btn{background:var(--pen);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700}
:root[data-theme="dark"] .btn{color:#0F1622}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0F1622}}
.btn:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.ghost.danger{color:var(--late);border-color:var(--late-soft)}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-h .mo{font-weight:700;font-family:var(--mono);font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding-bottom:4px;font-weight:500}
.cal .wd.sun{color:var(--late)}
.day{aspect-ratio:1/1;max-width:100%;border:1px solid transparent;border-radius:8px;background:transparent;padding:4px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-size:13px;font-family:var(--mono);min-width:0;text-align:left}
.day.out{opacity:.35}
.day.rest{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px)}
.day.today .n{background:var(--hl);color:var(--hl-ink);border-radius:4px;padding:0 4px}
.day.sel{border-color:var(--pen);background:var(--pen-soft)}
.day .dots{display:flex;flex-wrap:wrap;gap:2px}
.day .dots i{width:6px;height:6px;border-radius:50%}
.day .cnt{font-size:10px;color:var(--muted)}
.day .exam{font-size:10px;font-weight:600;color:var(--late);font-family:var(--sans);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

/* settings */
details.set{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0 16px}
details.set summary{cursor:pointer;padding:14px 0;font-weight:700}
.set-body{display:flex;flex-direction:column;gap:18px;padding-bottom:18px}
.subj{display:grid;grid-template-columns:auto minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.6fr) auto;gap:8px;align-items:end}
@media (max-width:700px){.subj{grid-template-columns:auto minmax(0,1fr)}.subj>label,.subj>.acts{grid-column:2}}
.swatch{width:28px;height:28px;border-radius:7px;border:0;margin-bottom:6px}
.acts{display:flex;gap:6px}
.weekdays{display:flex;gap:6px;flex-wrap:wrap}
.weekdays label{flex-direction:row;align-items:center;gap:4px;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.weekdays input{width:auto}
.note{font-size:13px;color:var(--muted);max-width:65ch}
.note b{color:var(--ink)}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>복습 플래너</h1>
      <div class="sub" id="todayLabel"></div>
    </div>
    <div class="status" id="status">불러오는 중…</div>
  </header>

  <section class="dday" id="dday" aria-label="시험까지 남은 날"></section>

  <div class="grid">
    <section class="panel" aria-labelledby="h-today">
      <div class="panel-h">
        <h2 id="h-today">오늘 할 복습</h2>
        <div class="summary" id="summary"></div>
      </div>
      <ul class="list" id="todayList"></ul>

      <div class="panel-h" style="margin-top:6px"><h2>새로 공부한 내용</h2></div>
      <form class="add" id="addForm">
        <label class="full">내용
          <input id="fTitle" required maxlength="120" placeholder="예) 일본어 활용 — て형 규칙">
        </label>
        <label>과목
          <select id="fSubject" required></select>
        </label>
        <label>공부한 날
          <input id="fDate" type="date" required>
        </label>
        <label class="full">복습 주기 (공부한 날로부터 며칠 뒤)
          <select id="fPreset">
            <option value="1,3,7,15,30">기본 · 1·3·7·15·30일</option>
            <option value="1,2,4,7">시험 직전 · 1·2·4·7일</option>
            <option value="1,7,30">가볍게 · 1·7·30일</option>
            <option value="custom">직접 입력</option>
          </select>
        </label>
        <label class="full" id="customWrap" hidden>일수 (쉼표로 구분)
          <input id="fCustom" placeholder="1,3,7" inputmode="numeric">
        </label>
        <div class="preview full" id="preview"></div>
        <div class="full"><button class="btn" id="addBtn" type="submit">복습 일정 만들기</button></div>
      </form>
    </section>

    <section class="panel" aria-labelledby="h-cal">
      <div class="cal-h">
        <button class="ghost" id="prevMo" aria-label="이전 달">‹</button>
        <div class="mo" id="h-cal"></div>
        <button class="ghost" id="nextMo" aria-label="다음 달">›</button>
      </div>
      <div class="cal" id="cal"></div>
      <div class="panel-h"><h2 id="selLabel"></h2></div>
      <ul class="list" id="selList"></ul>
    </section>
  </div>

  <details class="set" id="settings">
    <summary>과목 · 시험일 · 쉬는 요일</summary>
    <div class="set-body">
      <div>
        <h3 style="font-size:14px;margin-bottom:10px">과목</h3>
        <div id="subjList" style="display:flex;flex-direction:column;gap:12px"></div>
        <div style="margin-top:12px"><button class="ghost" id="addSubj" type="button">+ 과목 추가</button></div>
      </div>
      <div>
        <h3 style="font-size:14px;margin-bottom:10px">쉬는 요일</h3>
        <div class="weekdays" id="restDays"></div>
        <p class="note">쉬는 요일에 걸린 복습은 다음 공부하는 날로 미뤄요. 이미 만든 일정은 그대로 두고, 새로 추가하는 내용부터 적용돼요.</p>
      </div>
      <p class="note">시험일을 넣으면 그 과목의 복습은 <b>시험 전날까지만</b> 잡혀요. 매일 저녁 알림은 이 플래너의 오늘 복습과 시험 D-day를 읽어서 Claude 앱으로 보내요.</p>
    </div>
  </details>
</div>

<script>
(function(){
const $ = s => document.querySelector(s);
const WD = ['일','월','화','수','목','금','토'];
const COLORS = ['#2F7BD9','#D9483B','#2E9C6A','#9A55C9','#D98A1F','#1F9AA8'];
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

let db = null;
let subjects = [];   // {id,name,color,examDate,quizUrl,order}
let items = [];      // {id,subjectId,title,studiedOn,reviews:[{day,date,done,doneAt}]}
let settings = {restDays:[]};
let today = ymd(new Date());
let viewMonth = today.slice(0,7);
let selDay = today;
let confirmDel = null;

function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function diff(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function fmt(s){const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function subj(id){return subjects.find(s=>s.id===id)||{name:'과목 없음',color:'#888'}}
function setStatus(t,err){const el=$('#status');el.textContent=t;el.className='status'+(err?' err':'')}

function schedule(studiedOn,days,subjectId){
  const rest=new Set(settings.restDays||[]);
  const exam=subj(subjectId).examDate;
  const out=[];
  days.forEach(n=>{
    let d=addDays(studiedOn,n), guard=0;
    while(rest.has(parse(d).getDay()) && guard++<7) d=addDays(d,1);
    out.push({day:n,date:d,cut:!!(exam && d>=exam)});
  });
  return out;
}
function presetDays(){
  const v=$('#fPreset').value==='custom'?$('#fCustom').value:$('#fPreset').value;
  return [...new Set(v.split(/[,\s·]+/).map(Number).filter(n=>Number.isInteger(n)&&n>0&&n<=365))].sort((a,b)=>a-b);
}

/* ---------- render ---------- */
function renderAll(){
  today=ymd(new Date());
  $('#todayLabel').textContent=fmt(today).replace('(',' ').replace(')','요일')+' · '+today.slice(0,4)+'년';
  renderDday(); renderToday(); renderCal(); renderSel(); renderSubjSelect(); renderSettings(); renderPreview();
}
function renderDday(){
  const el=$('#dday');
  if(!subjects.length){el.innerHTML='';return}
  el.innerHTML=subjects.map(s=>{
    if(!s.examDate) return `<div class="dcard none"><span class="dot" style="background:${esc(s.color)}"></span><div><div class="nm">${esc(s.name)}</div><div class="dt">시험일 미정</div></div></div>`;
    const n=diff(today,s.examDate);
    const lbl=n>0?'D-'+n:n===0?'D-DAY':'끝';
    return `<div class="dcard"><span class="dot" style="background:${esc(s.color)}"></span><span class="num">${lbl}</span><div><div class="nm">${esc(s.name)}</div><div class="dt">${fmt(s.examDate)}</div></div></div>`;
  }).join('');
}
function dueOn(day){ // reviews scheduled exactly on day
  const r=[];
  items.forEach(it=>it.reviews.forEach((rv,i)=>{if(rv.date===day)r.push({it,i,rv})}));
  return r;
}
function overdue(){
  const r=[];
  items.forEach(it=>it.reviews.forEach((rv,i)=>{if(rv.date<today&&!rv.done)r.push({it,i,rv})}));
  return r.sort((a,b)=>a.rv.date.localeCompare(b.rv.date));
}
function rowHTML({it,i,rv},showLate){
  const s=subj(it.subjectId);
  const late=showLate&&rv.date<today&&!rv.done;
  const pips=it.reviews.map((r,k)=>`<b class="${r.done?'f':k===i?'c':''}"></b>`).join('');
  const quiz=s.quizUrl?`<a class="quiz" href="${esc(s.quizUrl)}" target="_blank" rel="noopener">퀴즈 열기</a>`:'';
  const del = confirmDel===it.id
    ? `<button class="ghost danger" data-del="${esc(it.id)}">정말 삭제</button><button class="ghost" data-cancel>취소</button>`
    : `<button class="ghost" data-ask="${esc(it.id)}" aria-label="이 내용 삭제">삭제</button>`;
  return `<li class="rv${rv.done?' done':''}">
    <button class="chk" data-it="${esc(it.id)}" data-i="${i}" aria-label="${rv.done?'완료 취소':'복습 완료'}" aria-pressed="${rv.done}">${CHECK}</button>
    <div style="min-width:0">
      <div class="ttl">${esc(it.title)}</div>
      <div class="meta">
        <span class="tag"><i style="background:${esc(s.color)}"></i>${esc(s.name)}</span>
        <span class="pill round">${i+1}회차 · ${rv.day}일째</span>
        ${late?`<span class="pill late">${diff(rv.date,today)}일 밀림</span>`:''}
        <span class="pips" title="복습 진행">${pips}</span>
        <span>공부 ${fmt(it.studiedOn)}</span>
      </div>
    </div>
    <div class="acts">${quiz}${del}</div>
  </li>`;
}
function renderToday(){
  const late=overdue(), now=dueOn(today);
  const all=[...late,...now];
  const done=now.filter(x=>x.rv.done).length;
  $('#summary').innerHTML=`<span>오늘 <strong>${now.length}</strong>개</span><span>완료 <strong>${done}</strong></span>${late.length?`<span style="color:var(--late)">밀린 복습 <strong style="color:var(--late)">${late.length}</strong></span>`:''}`;
  $('#todayList').innerHTML=all.length?all.map(x=>rowHTML(x,true)).join(''):`<li class="empty">${items.length?'오늘은 복습할 게 없어요.':'아래에 오늘 공부한 내용을 적으면 복습 날짜가 자동으로 잡혀요.'}</li>`;
}
function renderCal(){
  const [y,m]=viewMonth.split('-').map(Number);
  $('#h-cal').textContent=y+'. '+String(m).padStart(2,'0');
  const first=new Date(y,m-1,1), start=new Date(y,m-1,1-first.getDay());
  const byDay={};
  items.forEach(it=>it.reviews.forEach(rv=>{(byDay[rv.date]=byDay[rv.date]||[]).push({c:subj(it.subjectId).color,done:rv.done})}));
  const exams={};subjects.forEach(s=>{if(s.examDate)(exams[s.examDate]=exams[s.examDate]||[]).push(s.name)});
  const rest=new Set(settings.restDays||[]);
  let h=WD.map((w,i)=>`<div class="wd${i===0?' sun':''}">${w}</div>`).join('');
  for(let k=0;k<42;k++){
    const d=new Date(start);d.setDate(start.getDate()+k);const s=ymd(d);
    if(k>=35&&d.getMonth()!==m-1)break;
    const list=byDay[s]||[];
    const dots=list.slice(0,8).map(x=>`<i style="background:${x.done?'var(--line)':esc(x.c)}"></i>`).join('');
    const cls=['day',d.getMonth()!==m-1?'out':'',s===today?'today':'',s===selDay?'sel':'',rest.has(d.getDay())?'rest':''].join(' ');
    h+=`<button class="${cls}" data-day="${s}" aria-label="${fmt(s)} 복습 ${list.length}개"><span class="n">${d.getDate()}</span>${exams[s]?`<span class="exam">${esc(exams[s].join('·'))} 시험</span>`:''}<span class="dots">${dots}</span>${list.length>8?`<span class="cnt">+${list.length-8}</span>`:''}</button>`;
  }
  $('#cal').innerHTML=h;
}
function renderSel(){
  $('#selLabel').textContent=(selDay===today?'오늘 ':'')+fmt(selDay)+' 복습';
  const l=dueOn(selDay);
  $('#selList').innerHTML=l.length?l.map(x=>rowHTML(x,false)).join(''):'<li class="empty">이 날은 복습이 없어요.</li>';
}
function renderSubjSelect(){
  const sel=$('#fSubject'),cur=sel.value;
  sel.innerHTML=subjects.length?subjects.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join(''):'<option value="">먼저 과목을 추가하세요</option>';
  if(subjects.some(s=>s.id===cur))sel.value=cur;
}
function renderPreview(){
  const days=presetDays(),d=$('#fDate').value||today,sid=$('#fSubject').value;
  if(!days.length){$('#preview').innerHTML='복습 일수를 숫자로 적어 주세요.';return}
  const sc=schedule(d,days,sid);
  $('#preview').innerHTML='복습 날짜 '+sc.map(x=>`<span class="d${x.cut?' x':''}">${fmt(x.date)}</span>`).join('')+(sc.some(x=>x.cut)?' <span>· 줄 그은 날은 시험 뒤라 빠져요</span>':'');
}
let subjDirty=false;
function renderSettings(){
  if(subjDirty)return; // don't clobber inputs being edited
  $('#subjList').innerHTML=subjects.map(s=>`
    <div class="subj" data-sid="${esc(s.id)}">
      <button class="swatch" type="button" data-color style="background:${esc(s.color)}" aria-label="색 바꾸기"></button>
      <label>이름<input id="sn-${esc(s.id)}" data-f="name" value="${esc(s.name)}" maxlength="30"></label>
      <label>시험일<input id="se-${esc(s.id)}" data-f="examDate" type="date" value="${esc(s.examDate||'')}"></label>
      <label>퀴즈 링크<input id="sq-${esc(s.id)}" data-f="quizUrl" type="url" value="${esc(s.quizUrl||'')}" placeholder="https://"></label>
      <div class="acts"><button class="ghost" type="button" data-save>저장</button><button class="ghost danger" type="button" data-rm>${confirmDel==='s:'+s.id?'정말 삭제':'삭제'}</button></div>
    </div>`).join('')||'<div class="empty">과목이 없어요.</div>';
  const rest=new Set(settings.restDays||[]);
  $('#restDays').innerHTML=WD.map((w,i)=>`<label><input type="checkbox" id="rd-${i}" data-rd="${i}" ${rest.has(i)?'checked':''}>${w}</label>`).join('');
}

/* ---------- actions ---------- */
async function write(fn,okMsg){
  if(!db){setStatus('저장소에 연결되지 않아 저장할 수 없어요.',true);return false}
  try{await fn();if(okMsg)setStatus(okMsg);return true}
  catch(e){setStatus(e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼어요. 오래된 내용을 지워 주세요.':'저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.',true);return false}
}
async function toggle(itId,i){
  const it=items.find(x=>x.id===itId);if(!it)return;
  const reviews=it.reviews.map((r,k)=>k===i?{...r,done:!r.done,doneAt:!r.done?today:null}:r);
  it.reviews=reviews;renderAll();
  await write(()=>db.doc('items/'+itId).update({reviews}),'저장됨');
}
async function addItem(e){
  e.preventDefault();
  const title=$('#fTitle').value.trim(),sid=$('#fSubject').value,d=$('#fDate').value,days=presetDays();
  if(!title||!sid||!d||!days.length)return;
  const reviews=schedule(d,days,sid).filter(x=>!x.cut).map(x=>({day:x.day,date:x.date,done:false,doneAt:null}));
  if(!reviews.length){setStatus('시험일 전에 잡을 수 있는 복습이 없어요.',true);return}
  $('#addBtn').disabled=true;
  const ok=await write(()=>db.collection('items').add({subjectId:sid,title,studiedOn:d,reviews,createdAt:new Date().toISOString()}),'복습 '+reviews.length+'회를 잡았어요');
  $('#addBtn').disabled=false;
  if(ok){$('#fTitle').value='';$('#fTitle').focus()}
}
async function saveSubj(row){
  const id=row.dataset.sid,s=subj(id);
  const data={name:row.querySelector('[data-f=name]').value.trim()||s.name,examDate:row.querySelector('[data-f=examDate]').value||null,quizUrl:row.querySelector('[data-f=quizUrl]').value.trim()||null};
  subjDirty=false;
  await write(()=>db.doc('subjects/'+id).update(data),'과목을 저장했어요');
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.it){toggle(t.dataset.it,Number(t.dataset.i));return}
  if(t.dataset.day){selDay=t.dataset.day;renderCal();renderSel();return}
  if(t.dataset.ask){confirmDel=t.dataset.ask;renderToday();renderSel();return}
  if('cancel' in t.dataset){confirmDel=null;renderToday();renderSel();return}
  if(t.dataset.del){const id=t.dataset.del;confirmDel=null;items=items.filter(x=>x.id!==id);renderAll();await write(()=>db.doc('items/'+id).delete(),'삭제했어요');return}
  const row=t.closest('.subj');
  if(row&&'save' in t.dataset){saveSubj(row);return}
  if(row&&'color' in t.dataset){const s=subj(row.dataset.sid);const c=COLORS[(COLORS.indexOf(s.color)+1)%COLORS.length];await write(()=>db.doc('subjects/'+s.id).update({color:c}));return}
  if(row&&'rm' in t.dataset){
    const key='s:'+row.dataset.sid;
    if(confirmDel!==key){confirmDel=key;subjDirty=false;renderSettings();return}
    confirmDel=null;const id=row.dataset.sid;
    if(items.some(x=>x.subjectId===id)){setStatus('이 과목에 복습 내용이 남아 있어 지울 수 없어요.',true);renderSettings();return}
    await write(()=>db.doc('subjects/'+id).delete(),'과목을 지웠어요');return;
  }
});
$('#subjList').addEventListener('input',()=>{subjDirty=true});
$('#restDays').addEventListener('change',async e=>{
  const boxes=[...document.querySelectorAll('[data-rd]')].filter(b=>b.checked).map(b=>Number(b.dataset.rd));
  settings.restDays=boxes;renderCal();renderPreview();
  await write(()=>db.doc('settings/main').set({...settings,restDays:boxes}),'쉬는 요일을 저장했어요');
});
$('#addSubj').addEventListener('click',async()=>{
  const n=subjects.length;
  await write(()=>db.collection('subjects').add({name:'새 과목',color:COLORS[n%COLORS.length],examDate:null,quizUrl:null,order:n}),'과목을 추가했어요');
});
$('#prevMo').addEventListener('click',()=>{const d=parse(viewMonth+'-01');d.setMonth(d.getMonth()-1);viewMonth=ymd(d).slice(0,7);renderCal()});
$('#nextMo').addEventListener('click',()=>{const d=parse(viewMonth+'-01');d.setMonth(d.getMonth()+1);viewMonth=ymd(d).slice(0,7);renderCal()});
$('#addForm').addEventListener('submit',addItem);
['#fPreset','#fCustom','#fDate','#fSubject'].forEach(s=>$(s).addEventListener('input',()=>{$('#customWrap').hidden=$('#fPreset').value!=='custom';renderPreview()}));
$('#fDate').value=today;
renderAll();

/* ---------- data ---------- */
(async()=>{
  db=await (window.claude?.use?.('db')??null);
  if(!db){setStatus('저장소를 쓸 수 없는 화면이에요. claude.ai에서 열어 주세요.',true);return}
  const fail=()=>setStatus('데이터를 불러오지 못했어요. 새로고침해 주세요.',true);
  db.collection('subjects').onSnapshot(s=>{subjects=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??0)-(b.order??0));renderAll();setStatus('동기화됨')},fail);
  db.collection('items').onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>Array.isArray(x.reviews));renderAll();setStatus('동기화됨')},fail);
  db.doc('settings/main').onSnapshot(s=>{settings=s.exists?{restDays:[],...s.data()}:{restDays:[]};renderAll()},fail);
})();
setInterval(()=>{if(ymd(new Date())!==today)renderAll()},60000);
})();
</script>
