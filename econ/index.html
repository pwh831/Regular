<title>경제 지필고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Dancing+Script:wght@500&display=swap">
<style>
/* 복습 플래너·영단어 시험과 같은 노을 밤하늘. 한 가지 풍경으로 고정한 디자인이라 다크 모드를 따로 두지 않는다 */
:root{
  color-scheme:light;
  --ink:#2E2A5A; --text:#332F5C; --muted:#625E8C; --line:#E1DDF6;
  --glass:rgba(255,255,255,.86); --glass-edge:rgba(255,255,255,.72);
  --pen:#4A4FB0; --pen-soft:#ECEAFB; --row:#F4F2FD;
  --ok:#23845A; --ok-soft:#E1F3EA; --bad:#A33A5E; --bad-soft:#FBE1EA; --gold:#B7791F; --gold-soft:#FDF1D8;
  --serif:"Gowun Batang","AppleMyungjo",serif;
  --sans:"Gowun Dodum",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --script:"Dancing Script",cursive;
  --sky:linear-gradient(180deg,#2C3787 0%,#5566C9 22%,#9C93DE 40%,#E7B6D8 52%,#F4C9DD 55%,#B9AEE6 56%,#A89CE0 75%,#9A8FD8 100%);
}
*{box-sizing:border-box}
html{background:#2C3787}
body{background:var(--sky);background-attachment:fixed;min-height:100vh;color:var(--text);font:16px/1.6 var(--sans);padding-inline:16px;padding-block:28px 56px;overflow-x:hidden;margin:0}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sky .sea{position:absolute;left:0;right:0;top:56%;bottom:0;background:repeating-linear-gradient(180deg,transparent 0 9px,rgba(255,255,255,.13) 10px,transparent 12px)}
.sky .cloud{position:absolute;border-radius:50%;filter:blur(28px)}
.sky .st{position:absolute;border-radius:50%;background:#fff}
.sky .moon{position:absolute;right:12%;top:56px;width:56px;height:56px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px;position:relative;z-index:1}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:700;text-wrap:balance}
h1{font-size:32px;line-height:1.2;color:#fff}
h2{font-size:20px;color:var(--ink)}
.script{font-family:var(--script);font-size:26px;line-height:1;color:#FFE9F3}
.sub{color:#E4E3FF;font-size:14px;margin-top:4px}
.status{font-size:13px;color:#E4E3FF;min-height:20px;margin-top:6px}
.status.err{color:#fff;background:rgba(163,58,94,.8);padding:4px 10px;border-radius:99px;display:inline-block}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.panel{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--glass-edge);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 16px 40px rgba(44,55,135,.22)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:14px}
.btn{background:var(--pen);color:#fff;border:0;border-radius:14px;padding:12px 20px;font-weight:700;min-height:48px;font-size:16px}
.btn:disabled{opacity:.45;cursor:default}
.btn.stop{background:var(--bad)}
.ghost{background:#fff;border:1px solid #DAD5F5;border-radius:12px;padding:8px 14px;min-height:44px;color:var(--ink)}
.ghost:disabled{opacity:.45;cursor:default}
.hidden{display:none!important}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
textarea,select,input[type=file]{background:#fff;border:1.5px solid #DAD5F5;border-radius:14px;padding:10px 12px;color:var(--text);min-height:44px}
textarea{resize:vertical;line-height:1.5;width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

/* 탭 */
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;background:rgba(255,255,255,.18);border-radius:18px;padding:6px}
.tab{border:0;background:transparent;color:#fff;border-radius:13px;padding:10px 2px;min-height:48px;font-weight:700;font-size:15px;word-break:keep-all}
@media (max-width:420px){.tab{font-size:13px}}
.tab[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(30,36,100,.2)}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;margin-left:4px}

/* 단원 */
.unit{display:flex;flex-direction:column;gap:6px}
.unit-h{background:none;border:0;padding:4px 0;text-align:left;font-family:var(--serif);font-weight:700;color:var(--ink);font-size:15px;min-height:32px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--row);border:1.5px solid #E4E0F8;border-radius:99px;padding:6px 12px;min-height:38px;font-size:14px;color:var(--ink);text-align:left}
.chip[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:#fff}

/* 시험지 */
.paper{background:#FFFEFA;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:22px;border:1px solid #EDE9DA}
.paper-h{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:10px}
.paper-h h2{font-size:22px}
.q{display:flex;flex-direction:column;gap:10px;scroll-margin-top:12px}
.q-top{display:flex;gap:8px;align-items:baseline}
.q-no{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--ink);flex:none}
.q-stem{flex:1;min-width:0}
.q-pt{flex:none;font-size:13px;color:var(--muted)}
.q .tag{font-size:12px;color:var(--muted)}
.box{border:1px solid #BDB6E6;border-radius:8px;padding:10px 14px;position:relative;margin-top:6px}
.box::before{content:"보기";position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#FFFEFA;padding:0 8px;font-size:12px;color:var(--muted)}
.box.plain::before{content:"자료"}
.choices{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.choice{width:100%;text-align:left;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;background:var(--row);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;min-height:48px;color:var(--text);font-size:15px}
.choice .k{width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:13px;color:var(--pen);font-weight:700;border:1px solid #DAD5F5}
.choice[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft)}
.choice[aria-pressed="true"] .k{background:var(--pen);color:#fff;border-color:var(--pen)}
.choice.right{background:var(--ok-soft);border-color:var(--ok)}
.choice.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.choice.wrong{background:var(--bad-soft);border-color:var(--bad)}
.choice.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.choice:disabled{cursor:default}
.explain{background:var(--row);border-radius:12px;padding:10px 14px;font-size:15px}
.explain.ok{background:var(--ok-soft)}
.explain.bad{background:var(--bad-soft)}
.explain.mid{background:var(--gold-soft)}
.mark{font-weight:700}
.mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)} .mark.mid{color:var(--gold)}
.omr{display:flex;flex-wrap:wrap;gap:6px}
.omr a{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid #DAD5F5;color:var(--ink);text-decoration:none;font-size:13px}
.omr a.done{background:var(--pen);color:#fff;border-color:var(--pen)}
.omr a.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.omr a.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.omr a.mid{background:var(--gold);color:#fff;border-color:var(--gold)}
.score{display:flex;align-items:baseline;gap:6px;justify-content:center;font-family:var(--serif)}
.score b{font-size:56px;color:var(--ink);line-height:1}
.score span{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:#E9E6F8;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8E9BEA,#F0A9CB);transition:width .4s}

/* 목록 */
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:56px;width:100%;text-align:left;color:var(--text)}
.item .t{font-weight:700;color:var(--ink)}
.item .s{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--pen);white-space:nowrap}

/* 본문 서식 */
.md p{margin:4px 0}
.md h3{font-size:17px;color:var(--ink);margin:12px 0 4px}
.md h4{font-size:15px;color:var(--ink);margin:10px 0 2px;font-family:var(--serif)}
.md ul,.md ol{margin:4px 0;padding-left:22px}
.md code{background:var(--pen-soft);border-radius:6px;padding:1px 6px;font-size:14px}
.md pre{background:var(--row);border-radius:12px;padding:10px 12px;overflow-x:auto;font-size:14px;margin:8px 0}
.md pre code{background:none;padding:0}
.md .tbl{overflow-x:auto;margin:8px 0}
.md table{border-collapse:collapse;font-size:14px;min-width:100%}
.md th,.md td{border:1px solid #D8D3F0;padding:5px 9px;text-align:center;vertical-align:top}
.md th{background:var(--row);color:var(--ink)}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid #CFC9EE;color:var(--muted)}

/* 대화 */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{border-radius:18px;padding:12px 16px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--pen);color:#fff;border-bottom-right-radius:6px;max-width:85%;white-space:pre-wrap}
.msg.ai{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.err{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.composer{display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;min-height:52px;max-height:200px}
.note{font-size:12px;color:var(--muted)}
.wait{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;padding:10px 0}
.wait .big{font-family:var(--serif);font-size:19px;color:var(--ink)}

/* 슬라이드·서답형 */
.slides-pick{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow:auto;padding:4px 2px}
.chip .pg{font-size:11px;opacity:.75;margin-right:4px}
.chip.prio::after{content:" ★";color:var(--gold)}
.chip[aria-pressed="true"].prio::after{color:#FFE9A8}
.notice{border:1.5px solid var(--ink);padding:8px 12px;font-size:14px;line-height:1.5}
.sec-h{display:inline-block;border:1.5px solid var(--ink);padding:4px 16px;font-family:var(--serif);font-weight:700;color:var(--ink);align-self:flex-start}
.rub{border-collapse:collapse;width:100%;font-size:14px;margin-top:4px}
.rub td{border:1px solid #9C96C8;padding:6px 10px}
.rub td:first-child{background:#E6E3F2}
.rub td:last-child{text-align:center;white-space:nowrap;width:70px}
.src{font-size:12px;color:var(--pen);background:var(--pen-soft);border-radius:99px;padding:2px 10px;border:0;min-height:28px}
details.slide{background:#fff;border:1px solid var(--line);border-radius:16px;padding:0 14px}
details.slide>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:56px}
details.slide>summary::-webkit-details-marker{display:none}
details.slide>summary .pg{font-family:var(--serif);font-weight:700;color:var(--pen);width:34px;flex:none}
details.slide>summary .t{flex:1;min-width:0;font-weight:700;color:var(--ink)}
details.slide>summary .ok{color:var(--ok);font-size:13px;white-space:nowrap}
details.slide .notes{margin:0 0 10px;padding-left:18px;font-size:15px}
details.slide .notes li{margin:3px 0}
details.slide[open]{padding-bottom:14px}
details.slide.hot{border:2px solid var(--bad);background:var(--bad-soft)}
details.slide.hot>summary .t{color:var(--bad)}
.qq{display:flex;flex-direction:column;gap:8px;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
</style>

<div class="sky" aria-hidden="true">
  <div class="sea"></div>
  <div class="cloud" style="left:-6%;top:40%;width:46%;height:150px;background:rgba(255,236,246,.5)"></div>
  <div class="cloud" style="right:-8%;top:24%;width:40%;height:130px;background:rgba(238,226,255,.45)"></div>
  <svg class="moon" viewBox="0 0 64 64"><defs><mask id="cres"><rect width="64" height="64" fill="#fff"/><circle cx="42" cy="24" r="22" fill="#000"/></mask></defs><circle cx="30" cy="32" r="22" fill="#FFF6D8" mask="url(#cres)"/></svg>
  <div id="stars"></div>
</div>

<div class="wrap">
  <header>
    <div class="script">economics exam</div>
    <h1>경제 지필고사</h1>
    <div class="sub">수업 PPT에서 나오는 서답형 4문항과 객관식을 대비해요</div>
    <div class="status" id="status" role="status">불러오는 중…</div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="sd">서답형</button>
    <button class="tab" role="tab" data-tab="mc">객관식</button>
    <button class="tab" role="tab" data-tab="mq">암기</button>
    <button class="tab" role="tab" data-tab="sl">슬라이드</button>
    <button class="tab" role="tab" data-tab="wr">오답노트</button>
  </nav>

  <section id="v-sd" class="panel"></section>
  <section id="v-mc" class="panel hidden"></section>
  <section id="v-mq" class="panel hidden"></section>
  <section id="v-sl" class="panel hidden"></section>
  <section id="v-wr" class="panel hidden"></section>
</div>

<script>
const $=s=>document.querySelector(s);
const KEY='econ-exam-v2';
let S={sel:[],nMc:5,tier:'default'};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

let sample=null,db=null,imgCaps=null;
let slides=[];          // materials (쪽 순서)
let ref={style:'',past:null};
let exams=[];           // db exams (최신순)
let studied=new Set();  // progress/main.studied
const cur={sd:null,mc:null};
const view={sd:'setup',mc:'setup'}; // setup | busy | paper
let busy=null,tab='sd';

function setStatus(t,err){const s=$('#status');s.textContent=t;s.classList.toggle('err',!!err)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const CIRC=['①','②','③','④','⑤'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pg=n=>'#'+String(n).padStart(3,'0');
const fmt=n=>String(Math.round(n*10)/10);

/* ---------- 간단한 Markdown ---------- */
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>');
}
function md(src){
  const lines=String(src??'').replace(/\r/g,'').split('\n');let out='',i=0;
  while(i<lines.length){
    const l=lines[i];let m;
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])&&lines[i+1].includes('-')){
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim()));
      const h=cells(l);i+=2;const rows=[];
      while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i]))rows.push(cells(lines[i++]));
      out+=`<div class="tbl"><table><thead><tr>${h.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;continue}
    if(m=l.match(/^(#{1,6})\s+(.*)/)){out+=`<h4>${inline(m[2])}</h4>`;i++;continue}
    if(/^\s*[-*]\s+/.test(l)){const it=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i]))it.push(lines[i++].replace(/^\s*[-*]\s+/,''));out+=`<ul>${it.map(x=>`<li>${inline(x)}</li>`).join('')}</ul>`;continue}
    if(!l.trim()){i++;continue}
    const p=[];while(i<lines.length&&lines[i].trim()&&!/^(#{1,6}\s|\s*[-*]\s+|\s*\|)/.test(lines[i]))p.push(lines[i++]);
    if(!p.length)p.push(lines[i++]);
    out+=`<p>${p.map(inline).join('<br>')}</p>`;
  }
  return out;
}

/* ---------- Claude 오류 문구 ---------- */
const COPY={
  not_granted:'이 앱이 Claude를 쓰도록 허용하지 않았어요. 새로고침하면 다시 물어봐요.',
  sampling_disabled:'이 계정에서는 Claude를 쓸 수 없어요.',
  rate_limited:'요청이 많거나 사용량 한도에 닿았어요. 잠시 뒤에 다시 해 주세요.',
  session_expired:'claude.ai에 다시 로그인해 주세요.',
  refused:'이 요청에는 답할 수 없어요.',
  prompt_too_large:'고른 슬라이드가 너무 많아요. 줄여서 다시 해 주세요.',
  invalid_json:'결과를 읽지 못했어요. 다시 해 주세요.',
  image_rejected:'사진을 읽지 못했어요. 다른 사진으로 해 주세요.',
  empty_completion:'답이 비어 있어요. 다시 해 주세요.'
};
const errMsg=e=>COPY[e?.code]||'연결에 문제가 있었어요. 다시 해 주세요.';
function needClaude(){if(!sample){setStatus('Claude에 연결되지 않았어요. claude.ai에서 열어 주세요.',true);return false}return true}

/* ---------- 슬라이드 자료 ---------- */
// 고른 슬라이드(없으면 전부)를 보낸다. 전체 정리본은 약 5만 자라 한도 안에 들어가고, 한도는 나중에 자료가 늘 때를 위한 안전장치
const POOL_CHARS=80000;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selSlides(avoid){
  const s=new Set(S.sel),skip=new Set(avoid||[]);
  let base=S.sel.length?slides.filter(x=>s.has(x.page)):slides;
  const fresh=base.filter(x=>!skip.has(x.page));if(fresh.length>=4)base=fresh;
  const order=[...shuffle(base.filter(x=>x.hot)),...shuffle(base.filter(x=>x.prio&&!x.hot)),...shuffle(base.filter(x=>!x.prio))];
  const out=[];let n=0;
  for(const x of order){const c=x.text.length+x.title.length+30;if(out.length&&n+c>POOL_CHARS)continue;out.push(x);n+=c}
  return out.sort((a,b)=>a.page-b.page);
}
function slideText(list){return list.map(x=>`[${pg(x.page)} · ${x.unit}${x.tb?` · 교과서 ${x.tb}쪽`:''} · ${x.title}${x.hot?' · 선생님이 "시험에 낼거야"라고 적은 슬라이드':x.prio?' · 직접 추린 출제 후보':''}]\n${x.text}`).join('\n\n')}
function recentPages(kind,n){const out=new Set();exams.filter(e=>e.kind===kind).slice(0,n).forEach(e=>e.questions.forEach(q=>(q.slides||[]).forEach(p=>out.add(p))));return[...out]}
const openU=new Set(); // 펼쳐 둔 단원 (다시 그려도 유지)
function pickerHtml(){
  const sel=new Set(S.sel.length?S.sel:[]);const units=[...new Set(slides.map(x=>x.unit))];
  if(!slides.length)return `<p class="muted" style="margin:0">슬라이드 자료가 아직 없어요.</p>`;
  return `<div class="row"><span class="muted">출제 범위 · ${S.sel.length?S.sel.length+'장 고름':'전체 '+slides.length+'장'}</span>
    <span><button class="ghost" type="button" data-pick="all">전체</button> <button class="ghost" type="button" data-pick="prio">★만</button></span></div>

/* ---------- 채점 계산 ---------- */
function grade(ex,i){
  const q=ex.questions[i],max=Number(q.points)||0;
  if(q.type==='mc'){const a=ex.answers?.[i];return{max,score:a===q.answer?max:0}}
  const g=ex.graded?.[i];return{max,score:g?Math.max(0,Math.min(max,Number(g.score)||0)):0,g};
}
function total(ex){let s=0,m=0;ex.questions.forEach((q,i)=>{const g=grade(ex,i);s+=g.score;m+=g.max});return{raw:s,max:m}}
function answered(ex,i){const q=ex.questions[i],a=ex.answers?.[i];return q.type==='mc'?a!=null:!!String(a||'').trim()}

function cleanQs(j){
  return (Array.isArray(j?.questions)?j.questions:[]).map(q=>{
    const t=q.type==='mc'?'mc':q.type==='essay'?'essay':'short';
    const o={type:t,points:Math.max(1,Number(q.points)||0),stem:String(q.stem||''),data:String(q.data||''),slides:(Array.isArray(q.slides)?q.slides:[]).map(Number).filter(n=>n>0)};
    if(t==='mc'){
      o.box=String(q.box||'');o.choices=(Array.isArray(q.choices)?q.choices:[]).map(c=>String(c).replace(/^\s*[①②③④⑤]\s*/,''));
      o.answer=Number(q.answer)-1;o.explanation=String(q.explanation||'');
      if(o.choices.length!==5||!(o.answer>=0&&o.answer<5))return null;
    }else{
      o.no=Number(q.no)||0;o.kind=String(q.kind||(t==='essay'?'서술형':'단답형'));o.partial=String(q.partial||'');
      if(t==='short'){o.answer=String(q.answer||'');o.accept=(Array.isArray(q.accept)?q.accept:[]).map(String);o.explanation=String(q.explanation||'')}
      else{o.keyPoints=(Array.isArray(q.keyPoints)?q.keyPoints:[]).map(String);o.table=(Array.isArray(q.table)?q.table:[]).map(r=>({c:String(r.c||''),p:Number(r.p)||0}));o.modelAnswer=String(q.modelAnswer||'')}
    }
    return o.stem?o:null;
  }).filter(Boolean);
}

async function generate(kind){

  const n=kind==='mc'?S.nMc:4;

  view[kind]='busy';
  const v=$('#v-'+kind);
  v.innerHTML=`<div class="wait"><div class="big">${kind==='mc'?'PPT 객관식':'서답형 시험지'}를 만드는 중이에요</div>
    <div class="muted" id="gen-msg">슬라이드를 훑는 중… (1~2분)</div>
    <div class="bar" style="width:100%"><i id="gen-bar" style="width:3%"></i></div>
    <button class="btn stop" id="gen-stop" type="button">그만두기</button></div>`;
  const ctl=busy=new AbortController();$('#gen-stop').onclick=()=>ctl.abort();
  try{
    const j=await sample.json(prompt,{signal:ctl.signal,modelTier:S.tier,cache:false,onText:({text})=>{
      const k=(text.match(/"stem"\s*:/g)||[]).length;const m=$('#gen-msg'),b=$('#gen-bar');
      if(m)m.textContent=k?`${Math.min(k,n)}번 문제 쓰는 중… / ${n}문항`:'문제를 구상하는 중…';
      if(b)b.style.width=Math.max(3,Math.min(97,k/n*100))+'%';
    }});
    const qs=cleanQs(j).filter(q=>kind==='mc'?q.type==='mc':q.type!=='mc');
    if(!qs.length)throw{code:'invalid_json'};
    if(kind==='sd')qs.sort((a,b)=>(a.no||9)-(b.no||9));
    const ex={id:uid(),kind,createdAt:new Date().toISOString(),title:kind==='mc'?'PPT 객관식':'서답형 모의',sel:[...S.sel],status:'draft',answers:{},graded:{},mastered:[],questions:qs};
    exams.unshift(ex);cur[kind]=ex;view[kind]='paper';
    await saveExam(ex);
    setStatus(qs.length<n?`${qs.length}문항만 만들어졌어요(형식이 어긋난 문항은 뺐어요).`:'');
  }catch(e){view[kind]='setup';if(e?.code!=='cancelled')setStatus(errMsg(e),true)}

}

function rubricHtml(q){
  if(q.type==='short')return `<div><b>정답</b> ${esc(q.answer)}${q.accept?.length?` <span class="muted">(인정: ${q.accept.map(esc).join(', ')})</span>`:''}</div><div class="md">${md(q.explanation)}</div>`;

    <b>모범 답안</b><div class="md">${md(q.modelAnswer)}</div>`;

function qHtml(q,i,ex,mode){
  const a=ex.answers?.[i],g=grade(ex,i);
  const head=q.type==='mc'
    ?`<div class="q-top"><span class="q-no">${i+1}.</span><div class="q-stem md">${md(q.stem)} [${fmt(q.points)}]</div></div>`
    :`<div class="q-top"><div class="q-stem md">${md(`[ 서답형 ${q.no||i+1} ](${q.kind}) ${q.stem} (${fmt(q.points)}점. ${q.partial||''})`)}</div></div>`;
  let body='';
  if(q.type==='mc'){
    body=`<ul class="choices">${q.choices.map((c,k)=>{
      let cls='';if(mode==='review'){if(k===q.answer)cls='right';else if(a===k)cls='wrong'}
      return `<li><button class="choice ${cls}" type="button" data-q="${i}" data-k="${k}" aria-pressed="${a===k}" ${mode==='review'?'disabled':''}><span class="k">${k+1}</span><span class="md">${inline(c)}</span></button></li>`}).join('')}</ul>`;
    if(mode==='review'){const ok=a===q.answer;body+=`<div class="explain ${ok?'ok':'bad'}"><span class="mark ${ok?'ok':'bad'}">${ok?'정답':a==null?'안 풂':'오답'}</span> · 정답 ${CIRC[q.answer]}<div class="md">${md(q.explanation)}</div></div>`}
  }else{
    if(q.type==='essay'&&mode==='solve')body+=`<div><b style="font-size:14px">※ 채점 기준</b><table class="rub">${(q.table||[]).map(r=>`<tr><td>${esc(r.c)}</td><td>${fmt(r.p)}점</td></tr>`).join('')}</table></div>`;
    if(mode==='solve')body+=`<textarea rows="${q.type==='essay'?6:2}" data-es="${i}" placeholder="${q.type==='essay'?'답안을 쓰세요':'답'}">${esc(a||'')}</textarea>`;
    else{
      const r=g.g,cls=g.score>=g.max?'ok':g.score>0?'mid':'bad';
      body+=`<div class="explain"><b>내 답안</b><div style="white-space:pre-wrap">${esc(a||r?.read||'(비워 둠)')}</div></div>
        <div class="explain ${cls}"><span class="mark ${cls}">${fmt(g.score)} / ${fmt(g.max)}점</span>${r?.feedback?`<div class="md">${md(r.feedback)}</div>`:''}
        ${r?.missing?.length?`<div><b>빠진 핵심:</b> ${r.missing.map(esc).join(', ')}</div>`:''}</div>
        <div class="explain">${rubricHtml(q)}</div>`;
    }
  }
  return `<div class="q" id="q-${ex.kind}-${i}">${head}
    ${q.data?`<div class="box plain md">${md(q.data)}</div>`:''}${q.box?`<div class="box md">${md(q.box)}</div>`:''}
    ${body}${mode==='review'?`<div>${srcHtml(q)}</div>`:''}</div>`;
}

- 단답형 "부분 점수 없음": 정답 또는 인정 표기와 같은 뜻의 정확한 용어·이름이면 만점, 아니면 0점. 맞춤법이 조금 틀려도 같은 용어로 알아볼 수 있으면 인정. 비슷하지만 다른 용어는 0점.
- (A)(B)처럼 "각 2.5점"이면 칸마다 따로 채점.

${imgs.length?'- 학생 답안이 "(사진)"이면 첨부한 답안지 사진에서 그 번호의 답을 찾아 읽고, read에 읽은 그대로 옮겨 적는다. 찾을 수 없으면 0점.':''}
${todo.map(({q,i})=>`
### 문항 ${i} — 서답형 ${q.no||i+1} (${q.kind}, ${fmt(q.points)}점, ${q.partial})
발문: ${q.stem}
${q.data?'지문: '+q.data:''}
${q.type==='short'?`정답: ${q.answer}${q.accept?.length?' / 인정: '+q.accept.join(', '):''}`:`핵심 부분: ${(q.keyPoints||[]).map((k,n)=>`(${n+1}) ${k}`).join(' ')}
채점 기준표: ${(q.table||[]).map(r=>`${r.c} ${r.p}점`).join(' / ')}
모범 답안: ${q.modelAnswer}`}
학생 답안: ${String(ex.answers[i]||'').trim()||'(사진)'}`).join('\n')}

[출력] JSON 배열만: [{"i":문항번호,"score":점수,"read":"사진에서 읽은 답(사진이 아니면 빈 문자열)","feedback":"","missing":[]}]`;
    try{
      const r=await sample.json(prompt,{signal:ctl.signal,cache:false,...(imgs.length?{images:imgs}:{})});
      for(const x of Array.isArray(r)?r:[]){const i=Number(x.i);if(todo.some(t=>t.i===i))ex.graded[i]={score:Number(x.score)||0,read:String(x.read||''),feedback:String(x.feedback||''),missing:(Array.isArray(x.missing)?x.missing:[]).map(String)}}

const LONG=new Set(['목록','비교']);

function autoCheck(it,ans){
  const u=nrm(ans);if(!u)return false;
  const cands=[it.a,...(it.acc||[]),it.a.split(/[(:,/]/)[0]].map(nrm).filter(Boolean);
  return cands.some(c=>u===c||(c.length>=2&&u.includes(c))||(u.length>=2&&c.includes(u)&&u.length/c.length>=0.8));
}
function memoPool(){
  const m=S.mq;return memo.filter(x=>(!m.unit||x.u===m.unit)&&(!m.cat||x.c===m.cat)&&x.p>=m.imp);
}
function weakScore(x){const s=mstats[x.id];if(!s)return 0.5;return (s.x+1)/(s.c+s.x+2)} // 틀린 비율이 높을수록 큼, 처음 보는 건 중간
function buildQuiz(items){
  return items.map(it=>{
    const type=S.mq.mode==='mc'?'mc':S.mq.mode==='sa'?'sa':(LONG.has(it.c)||it.a.length>40?'mc':(Math.random()<.5?'sa':'mc'));
    const q={id:it.id,type};
    if(type==='mc'){
      const same=memo.filter(y=>y.id!==it.id&&y.c===it.c&&y.a!==it.a);
      const near=shuffle(same.filter(y=>y.u===it.u)),far=shuffle(same.filter(y=>y.u!==it.u));
      const ds=[];for(const y of [...near,...far]){if(ds.length>=4)break;if(!ds.includes(y.a))ds.push(y.a)}
      const ch=shuffle([it.a,...ds]);q.choices=ch;q.answer=ch.indexOf(it.a);
    }
    return q;
  });
}

  const m=S.mq,units=[...new Set(memo.map(x=>x.u))],cats=[...new Set(memo.map(x=>x.c))];
  const seen=memo.filter(x=>mstats[x.id]).length,ok=memo.filter(x=>mstats[x.id]?.last===1).length;
  const weak=memo.filter(x=>(mstats[x.id]?.x||0)>0).sort((a,b)=>weakScore(b)-weakScore(a)).slice(0,6);
  v.innerHTML=`<h2>암기 퀴즈</h2>
    <p class="muted" style="margin:-6px 0 0">암기 노트 PDF의 ${memo.length}개 항목으로 바로 문제를 내요. 객관식은 보기를 고르고, 주관식은 직접 써요. 단답형은 부분 점수가 없으니 정확한 명칭으로 쓰는 연습을 하세요.</p>
    <div class="row"><span class="muted">풀어 본 항목 ${seen} / ${memo.length} · 최근에 맞힌 항목 ${ok}</span></div>
    <div class="bar"><i style="width:${ok/memo.length*100}%"></i></div>
    <div class="grid3">
      <label class="f">단원<select data-mq="unit"><option value="">전체</option>${units.map(u=>`<option ${m.unit===u?'selected':''}>${esc(u)}</option>`).join('')}</select></label>
      <label class="f">분류<select data-mq="cat"><option value="">전체</option>${cats.map(c=>`<option ${m.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
      <label class="f">중요도<select data-mq="imp"><option value="2" ${m.imp==2?'selected':''}>★★만</option><option value="1" ${m.imp==1?'selected':''}>★ 이상</option><option value="0" ${m.imp==0?'selected':''}>전부(사소한 것 포함)</option></select></label>
      <label class="f">방식<select data-mq="mode"><option value="mix" ${m.mode==='mix'?'selected':''}>섞기</option><option value="mc" ${m.mode==='mc'?'selected':''}>객관식만</option><option value="sa" ${m.mode==='sa'?'selected':''}>주관식만</option></select></label>
      <label class="f">문항 수<select data-mq="n">${[10,20,30,50].map(n=>`<option value="${n}" ${m.n==n?'selected':''}>${n}문항</option>`).join('')}</select></label>
      <label class="f">순서<select data-mq="weak"><option value="0" ${!m.weak?'selected':''}>무작위</option><option value="1" ${m.weak?'selected':''}>틀린 것 위주</option></select></label>
    </div>
    <div class="row"><span class="muted">해당 항목 ${memoPool().length}개</span><button class="btn" type="button" data-mact="start">시작</button></div>
    ${weak.length?`<h2 style="font-size:17px">자주 틀린 항목</h2><ul class="list">${weak.map(x=>`<li class="item" style="display:block"><div>${starOf(x.p)}${esc(x.q)}</div><div style="font-weight:700;margin-top:2px">${esc(x.a)}</div><div class="muted" style="font-size:12px">맞힘 ${mstats[x.id].c} · 틀림 ${mstats[x.id].x} · ${pg(x.s)}</div></li>`).join('')}</ul>
      <div class="row" style="justify-content:flex-end"><button class="ghost" type="button" data-mact="weak">자주 틀린 것만 풀기</button></div>`:''}`;
}
function renderMemoQ(){
  const v=$('#v-mq'),q=MQ.qs[MQ.i],it=itemOf(q.id),r=MQ.res[MQ.i];
  const done=r!=null;
  let body='';
  if(q.type==='mc'){
    body=`<ul class="choices">${q.choices.map((c,k)=>{let cls='';if(done){if(k===q.answer)cls='right';else if(k===r.pick)cls='wrong'}
      return `<li><button class="choice ${cls}" type="button" data-mk="${k}" ${done?'disabled':''}><span class="k">${k+1}</span><span>${esc(c)}</span></button></li>`}).join('')}</ul>`;
  }else{
    body=`<form id="mq-form" class="composer"><textarea id="mq-ans" rows="${LONG.has(it.c)?4:1}" placeholder="${LONG.has(it.c)?'빠짐없이 써 보세요':'정확한 명칭으로'}" ${done?'disabled':''}>${esc(r?.text||'')}</textarea>${done?'':'<button class="btn" type="submit">확인</button>'}</form>
      ${done?'':'<div class="row" style="justify-content:flex-end"><button class="ghost" type="button" data-mact="giveup">모르겠어요</button></div>'}`;
  }
  let fb='';
  if(done){
    const cls=r.ok?'ok':'bad';
    fb=`<div class="explain ${cls}"><span class="mark ${cls}">${r.ok?'정답':'오답'}</span>${r.note?` · ${esc(r.note)}`:''}
      <div style="margin-top:4px"><b>정답</b> ${esc(it.a)}</div>${r.fb?`<div class="md">${md(r.fb)}</div>`:''}
      <div style="margin-top:6px"><button class="src" type="button" data-goto="${it.s}">PPT ${pg(it.s)} 보기</button></div></div>
      ${q.type==='sa'&&!r.ok&&!r.gaveUp?`<div class="row" style="justify-content:flex-end">${sample&&LONG.has(it.c)?'<button class="ghost" type="button" data-mact="claude">Claude에게 채점받기</button>':''}<button class="ghost" type="button" data-mact="override">맞았어요 (표기만 달라요)</button></div>`:''}
      <div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-mact="next">${MQ.i+1<MQ.qs.length?'다음':'결과 보기'}</button></div>`;
  }
  const nOk=Object.values(MQ.res).filter(x=>x.ok).length;
  v.innerHTML=`<div class="row"><button class="ghost" type="button" data-mact="quit">← 그만하기</button><span class="muted">${MQ.i+1} / ${MQ.qs.length} · 맞힘 ${nOk}</span></div>
    <div class="bar"><i style="width:${(MQ.i+(done?1:0))/MQ.qs.length*100}%"></i></div>
    <div class="muted" style="font-size:13px">${esc(it.u)} · ${esc(it.c)} · ${q.type==='mc'?'객관식':'주관식'}</div>
    <div style="font-family:var(--serif);font-weight:700;font-size:20px;color:var(--ink);line-height:1.4">${starOf(it.p)}${esc(it.q)}</div>
    ${body}${fb}`;
  if(!done&&q.type==='sa')setTimeout(()=>$('#mq-ans')?.focus(),0);
}
function renderMemoEnd(){
  const v=$('#v-mq'),n=MQ.qs.length,res=MQ.qs.map((q,i)=>({q,r:MQ.res[i]}));
  const ok=res.filter(x=>x.r?.ok).length,wrong=res.filter(x=>!x.r?.ok);
  v.innerHTML=`<h2>결과</h2><div class="score"><b>${ok}</b><span>/ ${n} 정답</span></div>
    ${wrong.length?`<h2 style="font-size:17px">틀린 항목</h2><ul class="list">${wrong.map(({q})=>{const it=itemOf(q.id);return `<li class="item" style="display:block"><div>${starOf(it.p)}${esc(it.q)}</div><div style="font-weight:700;margin-top:2px">${esc(it.a)}</div><div class="muted" style="font-size:12px">${pg(it.s)}</div></li>`}).join('')}</ul>`:'<p class="muted" style="margin:0">모두 맞혔어요!</p>'}
    <div class="row" style="justify-content:flex-end">${wrong.length?'<button class="ghost" type="button" data-mact="retrywrong">틀린 것만 다시</button>':''}<button class="ghost" type="button" data-mact="quit">설정으로</button><button class="btn" type="button" data-mact="again">새로 풀기</button></div>`;
}
function answerMemo(res){MQ.res[MQ.i]=res;record(MQ.qs[MQ.i].id,res.ok);renderMemoQ()}
async function claudeGrade(){
  const q=MQ.qs[MQ.i],it=itemOf(q.id),r=MQ.res[MQ.i];if(!needClaude()||!r)return;
  r.note='Claude가 채점하는 중…';renderMemoQ();
  try{
    const j=await sample.json(`고등학교 「경제」 암기 확인 문제 채점. 학생 답이 정답의 핵심 요소를 모두 담았는지 본다. 표현이 달라도 뜻이 같으면 인정, 빠진 요소가 있으면 오답.
문제: ${it.q}
정답: ${it.a}
학생 답: ${r.text}
JSON만: {"ok":true/false,"got":"맞힌 요소","missing":"빠진 요소","feedback":"한두 문장"}`,{cache:false,modelTier:'quick'});
    const was=r.ok;r.ok=!!j?.ok;r.note=r.ok?'Claude 채점: 인정':'Claude 채점';r.fb=[j?.feedback,j?.missing?`**빠진 것:** ${j.missing}`:''].filter(Boolean).join('\n');
    if(r.ok!==was){const s=mstats[it.id];if(s){if(r.ok){s.x=Math.max(0,s.x-1);s.c++}else{s.c=Math.max(0,s.c-1);s.x++}s.last=r.ok?1:0;saveMStats()}}
  }catch(e){r.note='';if(e?.code!=='cancelled')setStatus(errMsg(e),true)}
  renderMemoQ();
}
$('#v-mq').addEventListener('change',e=>{const k=e.target.dataset.mq;if(!k)return;const v=e.target.value;S.mq[k]=k==='n'||k==='imp'?+v:k==='weak'?v==='1':v;saveLocal();renderMemo()});
$('#v-mq').addEventListener('submit',e=>{e.preventDefault();const t=$('#mq-ans')?.value||'';if(!t.trim())return;const it=itemOf(MQ.qs[MQ.i].id);
  const ok=!LONG.has(it.c)&&autoCheck(it,t);answerMemo({text:t,ok,note:LONG.has(it.c)&&!ok?'목록형은 직접 비교하거나 Claude에게 채점받으세요':''})});
$('#v-mq').addEventListener('keydown',e=>{if(e.target.id==='mq-ans'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!LONG.has(itemOf(MQ.qs[MQ.i].id)?.c)){e.preventDefault();$('#mq-form').requestSubmit()}});
$('#v-mq').addEventListener('click',e=>{
  const k=e.target.closest('[data-mk]');
  if(k&&MQ&&MQ.res[MQ.i]==null){const q=MQ.qs[MQ.i],pick=+k.dataset.mk;answerMemo({pick,ok:pick===q.answer});return}
  const g=e.target.closest('[data-goto]');if(g)return gotoSlide(+g.dataset.goto);
  const a=e.target.closest('[data-mact]')?.dataset.mact;if(!a)return;
  if(a==='start')return startMemo(pickItems());
  if(a==='weak')return startMemo(memo.filter(x=>(mstats[x.id]?.x||0)>0).sort((a,b)=>weakScore(b)-weakScore(a)).slice(0,S.mq.n));
  if(a==='quit'){MQ=null;return renderMemo()}
  if(a==='next'){MQ.i++;renderMemo();return window.scrollTo({top:0})}
  if(a==='giveup')return answerMemo({text:$('#mq-ans')?.value||'',ok:false,gaveUp:true});
  if(a==='override'){const r=MQ.res[MQ.i],s=mstats[MQ.qs[MQ.i].id];if(r&&!r.ok){r.ok=true;r.note='직접 인정';if(s){s.x=Math.max(0,s.x-1);s.c++;s.last=1;saveMStats()}renderMemoQ()}return}
  if(a==='claude')return claudeGrade();
  if(a==='retrywrong')return startMemo(MQ.qs.filter((q,i)=>!MQ.res[i]?.ok).map(q=>itemOf(q.id)));
  if(a==='again')return startMemo(pickItems());
});

/* ---------- 오답노트 ---------- */
function wrongList(){
  const out=[];
  for(const ex of exams){if(ex.status!=='done')continue;
    ex.questions.forEach((q,i)=>{const g=grade(ex,i);if(g.score<g.max&&!(ex.mastered||[]).includes(i))out.push({ex,i,q})})}
  return out;
}
function renderBadge(){const n=wrongList().length;document.querySelector('.tab[data-tab="wr"]').innerHTML='오답노트'+(n?`<span class="n">${n}</span>`:'')}
function renderWrong(){
  renderBadge();
  const v=$('#v-wr'),list=wrongList();
  if(!list.length){v.innerHTML=`<h2>오답노트</h2><p class="muted" style="margin:0">${exams.some(x=>x.status==='done')?'틀린 문제가 없어요.':'시험지를 채점받으면 틀리거나 감점된 문항이 여기 모여요.'}</p>`;return}
  const bySlide={};for(const x of list)for(const p of x.q.slides||[])bySlide[p]=(bySlide[p]||0)+1;
  v.innerHTML=`<h2>오답노트 <span class="muted">${list.length}문항</span></h2>
    <div class="note">자주 틀린 슬라이드</div>
    <div class="chips">${Object.entries(bySlide).sort((a,b)=>b[1]-a[1]).map(([p,n])=>`<button class="chip" type="button" data-goto="${p}">${pg(+p)} ${esc(slides.find(x=>x.page===+p)?.title||'')} · ${n}</button>`).join('')}</div>
    <div class="paper">${list.map(({ex,i,q})=>`<div>${qHtml(q,i,ex,'review').replace(/ id="q-[^"]*"/,'')}
      <div class="row" style="margin-top:6px"><span class="muted">${esc(ex.title)}</span><button class="ghost" type="button" data-master="${esc(ex.id)}:${i}">이제 알아요 ✓</button></div></div>`).join('<hr style="border:0;border-top:1px dashed var(--line);margin:0">')}</div>`;
}
$('#v-wr').addEventListener('click',e=>{
  const m=e.target.closest('[data-master]');
  if(m){const [id,i]=m.dataset.master.split(':');const ex=exams.find(x=>x.id===id);if(!ex)return;ex.mastered=[...(ex.mastered||[]),+i];renderWrong();saveExam(ex);return}
  const g=e.target.closest('[data-goto]');if(g)gotoSlide(+g.dataset.goto);
});

document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){tab=b.dataset.tab;renderTab()}});

/* 별 */
(function(){let seed=11;const r=()=>(seed=(seed*9301+49297)%233280)/233280;let h='';
  for(let i=0;i<50;i++){const x=(r()*100).toFixed(1),y=(r()*42).toFixed(1),z=r()<.15?3:(r()<.5?2:1.4),o=(.45+r()*.55).toFixed(2);
    h+=`<span class="st" style="left:${x}%;top:${y}%;width:${z}px;height:${z}px;opacity:${o}${z===3?';box-shadow:0 0 6px #fff':''}"></span>`}
  $('#stars').innerHTML=h;})();

renderTab();

/* ---------- 연결 ---------- */
(async()=>{
  const [s,d]=await Promise.all([window.claude?.use?.('sample')??null,window.claude?.use?.('db')??null]);
  sample=s;db=d;
  if(sample)imgCaps=(await sample.limits().catch(()=>null))?.images||null;
  if(!db){setStatus('저장소에 연결할 수 없어요. claude.ai에서 열어 주세요.',true);return}
  try{
    const [m,r,x,p,mm,mp]=await Promise.all([db.collection('materials').get(),db.collection('reference').get(),db.collection('exams').orderBy('createdAt','desc').limit(200).get(),db.doc('progress/main').get(),db.doc('memo/all').get(),db.doc('progress/memo').get()]);
    // 정리본 전체는 materials/all 한 문서에 slides 배열로 들어 있다
    slides=m.docs.flatMap(y=>{const d=y.data();return Array.isArray(d?.slides)?d.slides:[d]}).filter(y=>y&&y.page).sort((a,b)=>a.page-b.page);
    for(const y of r.docs){if(y.id==='style')ref.style=y.data().text||'';if(y.id==='past-2025-1')ref.past=y.data()}
    exams=x.docs.map(y=>({...y.data(),id:y.id})).filter(y=>Array.isArray(y.questions)&&(y.kind==='sd'||y.kind==='mc'));
    if(p.exists)studied=new Set(p.data().studied||[]);
    if(mm.exists)memo=mm.data().items||[];
    if(mp.exists)mstats=mp.data().stats||{};
    S.sel=S.sel.filter(n=>slides.some(y=>y.page===n));
    setStatus(sample?'':'Claude에 연결할 수 없는 화면이에요. 문제 만들기와 채점은 claude.ai에서 돼요.',!sample);
  }catch(e){setStatus('자료를 불러오지 못했어요. 새로고침해 주세요.',true)}
  renderBadge();renderTab();
})();
</script>
