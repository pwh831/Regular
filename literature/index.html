<title>문학과 영상 지필고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Dancing+Script:wght@500&display=swap">
<style>
/* 복습 플래너·영단어 시험·경제 지필고사와 같은 노을 밤하늘. 한 가지 풍경으로 고정한 디자인이라 다크 모드를 따로 두지 않는다 */
:root{
  color-scheme:light;
  --ink:#2E2A5A; --text:#332F5C; --muted:#625E8C; --line:#E1DDF6;
  --glass:rgba(255,255,255,.86); --glass-edge:rgba(255,255,255,.72);
  --pen:#4A4FB0; --pen-soft:#ECEAFB; --row:#F4F2FD;
  --ok:#23845A; --ok-soft:#E1F3EA; --bad:#A33A5E; --bad-soft:#FBE1EA; --gold:#B7791F; --gold-soft:#FDF1D8;
  --serif:"Gowun Batang","AppleMyungjo",serif;
  --sans:"Gowun Dodum",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --script:"Dancing Script",cursive;
  --sky:linear-gradient(180deg,#2C3787 0%,#5566C9 22%,#9C93DE 40%,#E7B6D8 52%,#F4C9DD 55%,#B9AEE6 56%,#A89CE0 75%,#9A8FD8 100%);
}
*{box-sizing:border-box}
html{background:#2C3787}
body{background:var(--sky);background-attachment:fixed;min-height:100vh;color:var(--text);font:16px/1.6 var(--sans);padding-inline:16px;padding-block:28px 56px;overflow-x:hidden;margin:0}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sky .sea{position:absolute;left:0;right:0;top:56%;bottom:0;background:repeating-linear-gradient(180deg,transparent 0 9px,rgba(255,255,255,.13) 10px,transparent 12px)}
.sky .cloud{position:absolute;border-radius:50%;filter:blur(28px)}
.sky .st{position:absolute;border-radius:50%;background:#fff}
.sky .moon{position:absolute;right:12%;top:56px;width:56px;height:56px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px;position:relative;z-index:1}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:700;text-wrap:balance}
h1{font-size:32px;line-height:1.2;color:#fff}
h2{font-size:20px;color:var(--ink)}
.script{font-family:var(--script);font-size:26px;line-height:1;color:#FFE9F3}
.sub{color:#E4E3FF;font-size:14px;margin-top:4px}
.status{font-size:13px;color:#E4E3FF;min-height:20px;margin-top:6px}
.status.err{color:#fff;background:rgba(163,58,94,.8);padding:4px 10px;border-radius:99px;display:inline-block}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.panel{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--glass-edge);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 16px 40px rgba(44,55,135,.22)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:14px}
.btn{background:var(--pen);color:#fff;border:0;border-radius:14px;padding:12px 20px;font-weight:700;min-height:48px;font-size:16px}
.btn:disabled{opacity:.45;cursor:default}
.btn.stop{background:var(--bad)}
.ghost{background:#fff;border:1px solid #DAD5F5;border-radius:12px;padding:8px 14px;min-height:44px;color:var(--ink)}
.ghost:disabled{opacity:.45;cursor:default}
.hidden{display:none!important}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
textarea,select,input[type=file]{background:#fff;border:1.5px solid #DAD5F5;border-radius:14px;padding:10px 12px;color:var(--text);min-height:44px}
textarea{resize:vertical;line-height:1.5;width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

/* 탭 */
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;background:rgba(255,255,255,.18);border-radius:18px;padding:6px}
.tab{border:0;background:transparent;color:#fff;border-radius:13px;padding:10px 2px;min-height:48px;font-weight:700;font-size:15px;white-space:nowrap}
@media (max-width:420px){.tab{font-size:14px}}
.tab[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(30,36,100,.2)}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;margin-left:4px}

/* 단원 */
.unit{display:flex;flex-direction:column;gap:6px}
.unit-h{background:none;border:0;padding:4px 0;text-align:left;font-family:var(--serif);font-weight:700;color:var(--ink);font-size:15px;min-height:32px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--row);border:1.5px solid #E4E0F8;border-radius:99px;padding:6px 12px;min-height:38px;font-size:14px;color:var(--ink);text-align:left}
.chip[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:#fff}

/* 시험지 */
.paper{background:#FFFEFA;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:22px;border:1px solid #EDE9DA}
.paper-h{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:10px}
.paper-h h2{font-size:22px}
.q{display:flex;flex-direction:column;gap:10px;scroll-margin-top:12px}
.q-top{display:flex;gap:8px;align-items:baseline}
.q-no{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--ink);flex:none}
.q-stem{flex:1;min-width:0}
.q-pt{flex:none;font-size:13px;color:var(--muted)}
.q .tag{font-size:12px;color:var(--muted)}
.box{border:1px solid #BDB6E6;border-radius:8px;padding:10px 14px;position:relative;margin-top:6px}
.box::before{content:"보기";position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#FFFEFA;padding:0 8px;font-size:12px;color:var(--muted)}
.box.plain::before{content:"자료"}
.choices{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.choice{width:100%;text-align:left;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;background:var(--row);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;min-height:48px;color:var(--text);font-size:15px}
.choice .k{width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:13px;color:var(--pen);font-weight:700;border:1px solid #DAD5F5}
.choice[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft)}
.choice[aria-pressed="true"] .k{background:var(--pen);color:#fff;border-color:var(--pen)}
.choice.right{background:var(--ok-soft);border-color:var(--ok)}
.choice.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.choice.wrong{background:var(--bad-soft);border-color:var(--bad)}
.choice.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.choice:disabled{cursor:default}
.explain{background:var(--row);border-radius:12px;padding:10px 14px;font-size:15px}
.explain.ok{background:var(--ok-soft)}
.explain.bad{background:var(--bad-soft)}
.explain.mid{background:var(--gold-soft)}
.mark{font-weight:700}
.mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)} .mark.mid{color:var(--gold)}
.omr{display:flex;flex-wrap:wrap;gap:6px}
.omr a{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid #DAD5F5;color:var(--ink);text-decoration:none;font-size:13px}
.omr a.done{background:var(--pen);color:#fff;border-color:var(--pen)}
.omr a.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.omr a.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.omr a.mid{background:var(--gold);color:#fff;border-color:var(--gold)}
.score{display:flex;align-items:baseline;gap:6px;justify-content:center;font-family:var(--serif)}
.score b{font-size:56px;color:var(--ink);line-height:1}
.score span{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:#E9E6F8;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8E9BEA,#F0A9CB);transition:width .4s}

/* 목록 */
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:56px;width:100%;text-align:left;color:var(--text)}
.item .t{font-weight:700;color:var(--ink)}
.item .s{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--pen);white-space:nowrap}

/* 본문 서식 */
.md p{margin:4px 0}
.md h3{font-size:17px;color:var(--ink);margin:12px 0 4px}
.md h4{font-size:15px;color:var(--ink);margin:10px 0 2px;font-family:var(--serif)}
.md ul,.md ol{margin:4px 0;padding-left:22px}
.md code{background:var(--pen-soft);border-radius:6px;padding:1px 6px;font-size:14px}
.md pre{background:var(--row);border-radius:12px;padding:10px 12px;overflow-x:auto;font-size:14px;margin:8px 0}
.md pre code{background:none;padding:0}
.md .tbl{overflow-x:auto;margin:8px 0}
.md table{border-collapse:collapse;font-size:14px;min-width:100%}
.md th,.md td{border:1px solid #D8D3F0;padding:5px 9px;text-align:center;vertical-align:top}
.md th{background:var(--row);color:var(--ink)}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid #CFC9EE;color:var(--muted)}

/* 대화 */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{border-radius:18px;padding:12px 16px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--pen);color:#fff;border-bottom-right-radius:6px;max-width:85%;white-space:pre-wrap}
.msg.ai{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.err{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.composer{display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;min-height:52px;max-height:200px}
.note{font-size:12px;color:var(--muted)}
.wait{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;padding:10px 0}
.wait .big{font-family:var(--serif);font-size:19px;color:var(--ink)}

/* 필기 · 원문 · 암기 카드 */
.memo{color:var(--bad);font-size:.92em}
.memo::before{content:"✎ ";}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.src{background:#FFFEFA;border:1px solid #EDE9DA;border-radius:18px;padding:16px 18px;max-height:70vh;overflow:auto}
.src h3{font-family:var(--serif)}
.card{background:#FFFEFA;border:1px solid #EDE9DA;border-radius:20px;min-height:220px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center;cursor:pointer;width:100%;color:var(--text)}
.card .term{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--ink);text-wrap:balance}
.card .def{font-size:17px;line-height:1.7;text-wrap:pretty}
.card .from{font-size:12px;color:var(--muted)}
.card .hint{font-size:13px;color:var(--muted)}
.known{font-size:13px;color:var(--ok)}
</style>

<div class="sky" aria-hidden="true">
  <div class="sea"></div>
  <div class="cloud" style="left:-6%;top:40%;width:46%;height:150px;background:rgba(255,236,246,.5)"></div>
  <div class="cloud" style="right:-8%;top:24%;width:40%;height:130px;background:rgba(238,226,255,.45)"></div>
  <svg class="moon" viewBox="0 0 64 64"><defs><mask id="cres"><rect width="64" height="64" fill="#fff"/><circle cx="42" cy="24" r="22" fill="#000"/></mask></defs><circle cx="30" cy="32" r="22" fill="#FFF6D8" mask="url(#cres)"/></svg>
  <div id="stars"></div>
</div>

<div class="wrap">
  <header>
    <div class="script">literature &amp; film</div>
    <h1>문학과 영상 지필고사</h1>
    <div class="sub">1단원 「문학과 영상 만나기」 범위와 수업 필기로 모의고사를 만들고 채점받아요</div>
    <div class="status" id="status" role="status">Claude에 연결하는 중…</div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="exam">모의고사</button>
    <button class="tab" role="tab" data-tab="cards">암기</button>
    <button class="tab" role="tab" data-tab="essay">서답형</button>
    <button class="tab" role="tab" data-tab="wrong">오답</button>
    <button class="tab" role="tab" data-tab="ask">질문</button>
  </nav>

  <!-- 모의고사 -->
  <section id="v-exam" class="panel"></section>

  <!-- 암기 -->
  <section id="v-cards" class="panel hidden"></section>

  <!-- 서답형 채점 -->
  <section id="v-essay" class="panel hidden">
    <h2>서답형 답안 채점</h2>
    <p class="muted" style="margin:0">문제와 내가 쓴 답을 넣으면 교과서 범위와 수업 필기를 기준으로 예상 점수, 빠진 핵심어, 고쳐 쓴 모범 답안을 알려 줘요.</p>
    <label class="f">문제 (제시문·조건까지 그대로)<textarea id="es-q" rows="4" placeholder="예) S#40에서 작가가 산과 덕임이 함께 시경의 구절을 읊는 장면을 넣은 의도를 영상의 형상화 방법과 관련지어 서술하시오. (5점)"></textarea></label>
    <label class="f">내 답안<textarea id="es-a" rows="5" placeholder="시험지에 쓴 그대로 적어 주세요"></textarea></label>
    <label class="f img-only hidden">답안 사진 (손글씨 가능, 선택)<input type="file" id="es-img" multiple></label>
    <label class="f">채점 기준 (선생님이 알려 준 게 있으면, 선택)<textarea id="es-r" rows="2" placeholder="예) 교차 편집 언급 2점, 두 사람의 마음이 연결됨 2점, 문장 완결 1점"></textarea></label>
    <div class="row"><span class="note">채점 결과는 참고용이에요. 실제 기준은 선생님마다 달라요.</span>
      <div><button class="btn stop hidden" id="es-stop" type="button">멈춤</button> <button class="btn" id="es-go" type="button">채점받기</button></div></div>
    <div id="es-out" class="md"></div>
  </section>

  <!-- 오답노트 -->
  <section id="v-wrong" class="panel hidden"></section>

  <!-- 질문하기 -->
  <section id="v-ask" class="panel hidden">
    <div class="row"><h2>질문하기</h2><button class="ghost" id="ask-clear" type="button">새 대화</button></div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="chips" id="ask-chips"></div>
    <form class="composer" id="ask-form">
      <textarea id="ask-box" rows="1" placeholder="헷갈리는 개념이나 장면을 물어보세요" aria-label="질문"></textarea>
      <button class="btn" id="ask-send" type="submit">보내기</button>
      <button class="btn stop hidden" id="ask-stop" type="button">멈춤</button>
    </form>
  </section>
</div>

<script src="materials.js"></script>
<script>
const $=s=>document.querySelector(s);
const SECS=window.LIT?.sections||[];
const EXAM_INFO=window.LIT?.exam||'';
const SIZES={real:{mc:21,es:8,label:'실전: 객관식 21 · 서답형 8'},half:{mc:10,es:4,label:'절반: 객관식 10 · 서답형 4'},short:{mc:6,es:2,label:'짧게: 객관식 6 · 서답형 2'}};
const KEY='lit-exam-v1';
let S={tier:'default',secs:SECS.map(x=>x.id),scope:'',size:'half',hard:'mid',chat:[],known:[],cardSrc:'전체',cardMode:'cards',srcSec:SECS[0]?.id};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
S.secs=S.secs.filter(id=>SECS.some(x=>x.id===id));
const srcText=ids=>SECS.filter(x=>!ids||ids.includes(x.id)).map(x=>x.text).join('\n\n');
const secNames=ids=>ids&&ids.length&&ids.length<SECS.length?SECS.filter(x=>ids.includes(x.id)).map(x=>x.short).join(' · '):'1단원 전체';
const TEACHER='너는 한국 고등학교 선택과목 「문학과 영상」을 가르치며 1단원 「문학과 영상 만나기」 지필고사를 출제·채점하는 교사다.';
const RANGE_NOTE=`아래 [시험 범위 자료]는 학생 교과서 본문을 옮겨 적은 것이다. 【필기: …】는 선생님이 수업에서 강조한 내용을 학생이 빨간 펜으로 적은 것이고("빨간색은 시험에 출제"), **굵은 글씨**와 "빨간 네모"는 교과서에 표시된 출제 예상 부분이다. 범위 밖 지식(다른 작품, 다른 용어)으로 문제를 내거나 채점하지 말고, 이 자료와 필기의 표현을 정답 근거로 삼는다.`;
const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

let sample=null,db=null,imgCaps=null;
let exams=[];           // db의 exams 문서들 (최신순)
let cur=null;           // 지금 보는 시험
let busy=null;          // 진행 중인 AbortController
let tab='exam';
const view={exam:'setup'}; // setup | gen | paper | grading

function setStatus(t,err){const s=$('#status');s.textContent=t;s.classList.toggle('err',!!err)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const CIRC=['①','②','③','④','⑤'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- 간단한 Markdown ---------- */
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>')
    .replace(/【([^】]*)】/g,'<span class="memo">$1</span>');
}
function md(src){
  const lines=String(src??'').replace(/\r/g,'').split('\n');let out='',i=0;
  while(i<lines.length){
    const l=lines[i];let m;
    if(/^```/.test(l)){let b=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))b.push(lines[i++]);i++;out+=`<pre><code>${esc(b.join('\n'))}</code></pre>`;continue}
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])&&lines[i+1].includes('-')){
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim()));
      const h=cells(l);i+=2;const rows=[];
      while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i]))rows.push(cells(lines[i++]));
      out+=`<div class="tbl"><table><thead><tr>${h.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;continue}
    if(m=l.match(/^(#{1,6})\s+(.*)/)){const t=m[1].length<=3?'h3':'h4';out+=`<${t}>${inline(m[2])}</${t}>`;i++;continue}
    if(/^\s*[-*]\s+/.test(l)){const it=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i]))it.push(lines[i++].replace(/^\s*[-*]\s+/,''));out+=`<ul>${it.map(x=>`<li>${inline(x)}</li>`).join('')}</ul>`;continue}
    if(/^\s*\d+[.)]\s+/.test(l)){const it=[];while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i]))it.push(lines[i++].replace(/^\s*\d+[.)]\s+/,''));out+=`<ol>${it.map(x=>`<li>${inline(x)}</li>`).join('')}</ol>`;continue}
    if(/^>\s?/.test(l)){const b=[];while(i<lines.length&&/^>\s?/.test(lines[i]))b.push(lines[i++].replace(/^>\s?/,''));out+=`<blockquote>${b.map(inline).join('<br>')}</blockquote>`;continue}
    if(/^\s*(---|\*\*\*)\s*$/.test(l)||!l.trim()){i++;continue}
    const p=[];while(i<lines.length&&lines[i].trim()&&!/^(#{1,6}\s|```|\s*[-*]\s+|\s*\d+[.)]\s+|>|\s*\|)/.test(lines[i]))p.push(lines[i++]);
    if(!p.length)p.push(lines[i++]);
    out+=`<p>${p.map(inline).join('<br>')}</p>`;
  }
  return out;
}

/* ---------- 채점 계산 ---------- */
function grade(ex,i){
  const q=ex.questions[i],max=Number(q.points)||0;
  if(q.type==='mc'){const a=ex.answers?.[i];return{max,score:a===q.answer?max:0,answered:a!=null}}
  const g=ex.graded?.[i];return{max,score:g?Math.max(0,Math.min(max,Number(g.score)||0)):0,answered:!!(ex.answers?.[i]||'').trim(),g};
}
function total(ex){
  let s=0,m=0;ex.questions.forEach((q,i)=>{const g=grade(ex,i);s+=g.score;m+=g.max});
  return{raw:s,max:m,pct:m?Math.round(s/m*100):0};
}

[출제 규칙]
- 한국 고등학교 국어·문학 시험지 말투로 쓴다("윗글에 대한 설명으로 적절하지 않은 것은?", "ⓐ~ⓔ에 대한 이해로 가장 적절한 것은?", "<보기>를 참고하여 ㉠을 감상한 내용으로 적절하지 않은 것은?", "(가)와 (나)를 비교한 내용으로 적절한 것은?").
- 제시문을 적극 쓴다: 이성부 「봄」 전문(범위에 있으면 원문 그대로, ㉠~㉤ 밑줄 문항과 해석 관점 문항을 꼭 넣는다), 대본 장면(S#21, S#39~42), 원작 소설 발췌, 작가의 글·〈한중록〉, 「문학과 영상이 세상을 그리는 방법」, 활동 작품(〈나는 오늘〉, 〈아주 환한 날들〉, 〈낮잠〉 장면 설명, 〈영진설비 돈 갖다주기〉, 로맨틱 코미디 글), 시나리오 용어 프린트. 제시문은 범위 자료 원문을 그대로 옮기고(필기 표시 【】는 빼고), 한 문항당 15줄 이내로 발췌한다. 밑줄 부분은 ㉠, ㉡ 또는 ⓐ, ⓑ 기호를 붙여 표시한다.
- 【필기】와 굵은 글씨·빨간 네모 부분에서 많이 낸다. 특히 「문학과 영상이 세상을 그리는 방법」은 지문 전체가 범위이므로 여러 문항을 낸다.
- 이성부 「봄」이 범위에 있으면 수능형과 내신형을 섞어 낸다(어느 쪽으로 나올지 모르므로 대략 반반).
  · 수능형: (가) 「봄」 + (나) 비교 작품(범위 자료의 「봄은」, 「모란이 피기까지는」, 「너를 기다리는 동안」 원문 중 하나)의 복합 지문 세트. 발문 예: "(가)와 (나)의 공통점으로 가장 적절한 것은?", "<보기>를 참고하여 (가)를 감상한 내용으로 적절하지 않은 것은?"(외적 준거 <보기>를 직접 써서 box에 넣고 선지는 '~군.'으로 끝냄), "(가)의 화자의 태도·시상 전개로 적절한 것은?". 선지는 '표현 방식 + 효과'를 함께 묻는다.
  · 내신형: 「봄」 단독 지문(㉠~㉤ 밑줄). 발문 예: "위 시에 대한 설명으로 적절하지 않은 것은?", "㉠~㉤의 의미로 알맞지 않은 것은?", "'바람'의 역할로 적절한 것은?", "<보기>와 같이 시를 해석한 관점은?"(반영론·표현론·효용론·절대론), "화자의 정서 변화로 적절한 것은?".
  · 두 유형 모두 이 시에 없는 표현(청유형, 역설, 반어, 수미상관, 색채어, 음성 상징어 등)을 매력적 오답으로 쓴다. 서답형도 1문항 이상 낸다(시어 찾아 쓰기, 해석 관점 쓰기, 조건에 맞춰 시구의 의미 서술).
  · 시와 비교 작품은 범위 자료의 원문을 한 글자도 바꾸지 않고 행 구분은 줄바꿈으로 옮기며, 범위 자료에 없는 작품은 인용하지 않는다.
- 암기형 문항을 섞는다: 숏의 종류와 쓰임, 앵글, 카메라 이동 방식(팬·틸트·달리·드론·핸드헬드·크레인), 미장센·몽타주, 청각적 요소, 네 갈래의 형상화 방법, 시나리오 용어(씬 헤딩, INT/EXT, V.O./O.S./E, 인서트, 교차 편집, F.I./F.O. 등), 어휘 풀이.
- 대본 지문을 영상 용어로 해석하는 문항을 낸다(예: 어떤 지문이 오프 스크린인지, 클로즈업으로 무엇을 표현했는지, 교차 편집의 효과). 단, 선생님 말처럼 두 가지 기법이 모두 답이 될 수 있는 애매한 경우(오프 스크린/보이스 오버, 크로스 컷/인서트 등)는 정답이 하나로 확실할 때만 낸다.
- <보기> 고르기 문항이면 box에 "ㄱ. …\\nㄴ. …\\nㄷ. …\\nㄹ. …"를 넣고 선택지는 "ㄱ, ㄴ" 같은 조합으로 한다. 제시문은 data에, <보기>는 box에 넣는다.
- 정답은 반드시 하나뿐이어야 한다. 문제마다 범위 자료와 대조해 스스로 풀어 보고, 복수 정답이나 근거 없는 선택지가 있으면 고친 뒤 적는다. 정답 번호는 1~5에 고르게 나눈다.
- 해설: 정답 근거(범위 자료의 어느 부분인지)와 오답 선택지가 틀린 이유를 짧게.
- 서답형은 단답형(용어·어휘·기호 쓰기)과 서술형(조건 제시: "~를 포함하여 두 문장 이내로 서술하시오", "~와 비교하여 쓰시오")을 섞는다. 활동 문항과 교과서 질문(①②③)을 변형해도 좋다. 채점 기준은 부분 점수 항목으로 나누고, 모범 답안은 교과서 예시 답과 필기의 표현을 살려 쓴다.
- 객관식 배점은 3~4점, 서답형은 2~6점으로 해서 객관식 합계 70점, 서답형 합계 30점을 정확히 맞춘다.
- 범위 밖 내용은 내지 않는다.

[출력] 다른 말 없이 JSON 하나만:
{"title":"시험지 제목(예: 1학기 기말고사 대비 1회)","questions":[
 {"type":"mc","unit":"범위 이름(옷소매 대본/원작 소설/작가의 글·한중록/형상화 방법/형상화 활동/이성부 봄/시나리오 용어/단원 도입 중 하나)","points":3,"stem":"발문","data":"제시문(Markdown, 없으면 빈 문자열)","box":"<보기> 내용(없으면 빈 문자열)","choices":["①내용","②","③","④","⑤ (번호 기호 없이 내용만)"],"answer":3,"explanation":"해설"},
 {"type":"essay","unit":"범위 이름","points":4,"stem":"발문과 조건","data":"","box":"","rubric":[{"c":"채점 항목","p":2}],"modelAnswer":"모범 답안"}
]}
객관식을 먼저, 서답형을 뒤에 둔다.

[시험 범위 자료]
${srcText(S.secs)}`;
}
function cleanExam(j){
  const qs=(Array.isArray(j?.questions)?j.questions:[]).map(q=>{
    const o={type:q.type==='essay'?'essay':'mc',unit:String(q.unit||''),points:Math.max(1,Math.round(Number(q.points)||0)),stem:String(q.stem||''),data:String(q.data||''),box:String(q.box||'')};
    if(o.type==='mc'){
      o.choices=(Array.isArray(q.choices)?q.choices:[]).map(c=>String(c).replace(/^\s*[①②③④⑤]\s*/,''));
      o.answer=Number(q.answer)-1;o.explanation=String(q.explanation||'');
      if(o.choices.length!==5||!(o.answer>=0&&o.answer<5))return null;
    }else{
      o.rubric=(Array.isArray(q.rubric)?q.rubric:[]).map(r=>({c:String(r.c||''),p:Number(r.p)||0}));
      o.modelAnswer=String(q.modelAnswer||'');
    }
    return o.stem?o:null;
  }).filter(Boolean);
  return{title:String(j?.title||'문학과 영상 모의고사'),questions:qs};
}
async function generate(){
  if(!sample){setStatus('Claude에 연결되지 않았어요. claude.ai에서 열어 주세요.',true);return}
  readSetup();
  const imgs=files($('#scope-img'));S._imgs=imgs.length>0;
  const prompt=examPrompt();delete S._imgs;
  view.exam='gen';
  const total=(SIZES[S.size]||SIZES.half).mc+(SIZES[S.size]||SIZES.half).es;
  $('#v-exam').innerHTML=`<div class="wait"><div class="big">시험지를 만드는 중이에요</div>
    <div class="muted" id="gen-msg">범위를 읽고 문제를 구상하는 중… (문항 수에 따라 1~5분)</div>
    <div class="bar" style="width:100%"><i id="gen-bar" style="width:3%"></i></div>
    <button class="btn stop" id="gen-stop" type="button">그만두기</button></div>`;
  const ctl=busy=new AbortController();
  $('#gen-stop').onclick=()=>ctl.abort();
  try{
    const j=await sample.json(prompt,{signal:ctl.signal,modelTier:S.tier,cache:false,...(imgs.length?{images:imgs}:{}),
      onText:({text})=>{
        const n=(text.match(/"type"\s*:/g)||[]).length;
        const m=$('#gen-msg'),b=$('#gen-bar');
        if(m)m.textContent=n?`${Math.min(n,total)}번 문제 쓰는 중… / ${total}문항`:'제목과 구성을 정하는 중…';
        if(b)b.style.width=Math.max(3,Math.min(97,n/total*100))+'%';
      }});
    const ex=cleanExam(j);
    if(!ex.questions.length)throw{code:'invalid_json'};
    cur={id:uid(),createdAt:new Date().toISOString(),secs:[...S.secs],scope:S.scope,status:'draft',answers:{},graded:{},mastered:[],...ex};
    exams.unshift(cur);
    await saveExam(cur);
    view.exam='paper';
    setStatus(ex.questions.length<total?`${ex.questions.length}문항이 만들어졌어요(형식이 어긋난 문항은 뺐어요).`:'');
    renderPaper();window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){
    view.exam='setup';renderExam();
    if(e?.code!=='cancelled')setStatus(errMsg(e),true);
  }finally{busy=null}
}
function readSetup(){
  const g=id=>document.getElementById(id);
  if(!g('size'))return;
  S.size=g('size').value;S.hard=g('hard').value;S.tier=g('tier').value;S.scope=g('scope').value;
  saveLocal();
}

/* ---------- 모의고사: 시험지 ---------- */
function qHtml(q,i,ex,mode){ // mode: solve | review
  const a=ex.answers?.[i];const g=grade(ex,i);
  let body='';
  if(q.type==='mc'){
    body=`<ul class="choices">${q.choices.map((c,k)=>{
      let cls='',pressed=a===k;
      if(mode==='review'){if(k===q.answer)cls='right';else if(a===k)cls='wrong'}
      return `<li><button class="choice ${cls}" type="button" data-q="${i}" data-k="${k}" aria-pressed="${pressed}" ${mode==='review'?'disabled':''}><span class="k">${k+1}</span><span class="md">${inline(c)}</span></button></li>`}).join('')}</ul>`;
    if(mode==='review'){
      const ok=a===q.answer;
      body+=`<div class="explain ${ok?'ok':'bad'}"><span class="mark ${ok?'ok':'bad'}">${ok?'정답':a==null?'안 풂':'오답'}</span> · 정답 ${CIRC[q.answer]}<div class="md">${md(q.explanation)}</div></div>`;
    }
  }else{
    if(mode==='solve')body=`<textarea rows="5" data-es="${i}" placeholder="답안을 쓰세요" aria-label="${i+1}번 답안">${esc(a||'')}</textarea>`;
    else{
      const r=g.g;const cls=g.score>=g.max?'ok':g.score>0?'mid':'bad';
      body=`<div class="explain"><b>내 답안</b><div style="white-space:pre-wrap">${esc(a||'(비워 둠)')}</div></div>
        <div class="explain ${cls}"><span class="mark ${cls}">${g.score} / ${g.max}점</span>${r?.feedback?`<div class="md">${md(r.feedback)}</div>`:''}
        ${r?.missing?.length?`<div><b>빠진 핵심:</b> ${r.missing.map(esc).join(', ')}</div>`:''}</div>
        <div class="explain"><b>채점 기준</b><ul style="margin:4px 0;padding-left:20px">${(q.rubric||[]).map(x=>`<li>${esc(x.c)} (${x.p}점)</li>`).join('')}</ul><b>모범 답안</b><div class="md">${md(q.modelAnswer)}</div></div>`;
    }
  }
  return `<div class="q" id="q${i}"><div class="q-top"><span class="q-no">${i+1}.</span><div class="q-stem md">${md(q.stem)}</div><span class="q-pt">[${q.points}점]</span></div>
    ${q.data?`<div class="box plain md">${md(q.data)}</div>`:''}
    ${q.box?`<div class="box md">${md(q.box)}</div>`:''}
    ${body}${mode==='review'&&q.unit?`<div class="tag">${esc(q.unit)}</div>`:''}</div>`;
}
function renderPaper(){
  const ex=cur,done=ex.status==='done',mode=done?'review':'solve';
  const v=$('#v-exam');
  const t=total(ex);
  const nMc=ex.questions.filter(q=>q.type==='mc').length,nEs=ex.questions.length-nMc;
  const omr=ex.questions.map((q,i)=>{
    let c='';
    if(done){const g=grade(ex,i);c=g.score>=g.max?'ok':g.score>0?'mid':'bad'}
    else if(q.type==='mc'?ex.answers[i]!=null:(ex.answers[i]||'').trim())c='done';
    return `<a href="#q${i}" class="${c}" data-jump="${i}">${i+1}</a>`}).join('');
  v.innerHTML=`
    <div class="row"><button class="ghost" id="back" type="button">← 목록</button>
      ${done?`<button class="ghost" id="retry" type="button">다시 풀기</button>`:''}</div>
    ${done?`<div class="score"><b>${t.pct}</b><span>점 / 100</span></div>
      <div class="muted" style="text-align:center">${t.raw} / ${t.max}점 · 객관식 ${ex.questions.filter((q,i)=>q.type==='mc'&&grade(ex,i).score>=grade(ex,i).max).length}/${nMc} 정답${nEs?` · 서답형 ${ex.questions.reduce((s,q,i)=>s+(q.type==='essay'?grade(ex,i).score:0),0)}/${ex.questions.reduce((s,q)=>s+(q.type==='essay'?q.points:0),0)}점`:''}</div>`:''}
    <div class="omr" aria-label="문항 바로 가기">${omr}</div>
    <div class="paper">
      <div class="paper-h"><h2>${esc(ex.title)}</h2><div class="muted">${esc(secNames(ex.secs))}</div>
        <div class="muted">객관식 ${nMc}문항 · 서답형 ${nEs}문항 · 100점</div></div>
      ${ex.questions.map((q,i)=>qHtml(q,i,ex,mode)).join('')}
    </div>
    ${done?'':`<div class="row"><span class="muted" id="left"></span><button class="btn" id="submit" type="button">답안 제출</button></div>`}`;
  updateLeft();
}
function updateLeft(){
  const el=$('#left');if(!el||!cur)return;
  const n=cur.questions.filter((q,i)=>q.type==='mc'?cur.answers[i]==null:!(cur.answers[i]||'').trim()).length;
  el.textContent=n?`안 푼 문항 ${n}개`:'모두 풀었어요';
}
let saveT=null;
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(()=>cur&&saveExam(cur),1200)}
async function saveExam(ex){
  if(!db)return;
  try{await db.doc('exams/'+ex.id).set(JSON.parse(JSON.stringify(ex)))}
  catch(e){setStatus('시험지를 저장하지 못했어요. 이 화면을 닫으면 사라질 수 있어요.',true)}
}

async function submit(){
  const ex=cur;
  const left=ex.questions.filter((q,i)=>q.type==='mc'?ex.answers[i]==null:!(ex.answers[i]||'').trim()).length;
  const btn=$('#submit');
  if(left&&btn&&!btn.dataset.armed){btn.dataset.armed='1';btn.textContent='그래도 제출';$('#left').textContent=`안 푼 문항이 ${left}개 있어요. 한 번 더 누르면 제출해요.`;return}
  clearTimeout(saveT);
  const essays=ex.questions.map((q,i)=>({q,i})).filter(x=>x.q.type==='essay'&&(ex.answers[x.i]||'').trim());
  ex.graded={};
  if(essays.length){
    if(!sample){setStatus('Claude에 연결되지 않아 서답형을 채점할 수 없어요.',true);return}
    view.exam='grading';
    $('#v-exam').innerHTML=`<div class="wait"><div class="big">서답형을 채점하는 중이에요</div><div class="muted">채점 기준에 맞춰 부분 점수를 매겨요 (30초~1분)</div><button class="btn stop" id="gen-stop" type="button">그만두기</button></div>`;
    const ctl=busy=new AbortController();$('#gen-stop').onclick=()=>ctl.abort();
    const prompt=`${TEACHER} 서답형 답안을 채점 기준에 맞춰 공정하게 부분 점수로 채점한다. 단답형은 용어가 정확해야 정답이다(띄어쓰기·영문 병기 차이는 인정). 서술형은 핵심어가 빠지거나 근거가 범위 자료와 다르면 감점하고, 표현이 달라도 뜻이 맞으면 인정한다. 피드백은 학생에게 말하듯 한국어로 2~3문장.
${RANGE_NOTE}
${essays.map(({q,i})=>`
### 문항 ${i}
배점: ${q.points}
발문: ${q.stem}
${q.data?'제시문: '+q.data:''}
채점 기준: ${(q.rubric||[]).map(r=>`${r.c}(${r.p}점)`).join(' / ')}
모범 답안: ${q.modelAnswer}
학생 답안: ${ex.answers[i]}`).join('\n')}

[출력] JSON 배열만: [{"i":문항번호,"score":점수,"feedback":"피드백","missing":["빠진 핵심어"]}]

[시험 범위 자료]
${srcText(ex.secs)}`;
    try{
      const r=await sample.json(prompt,{signal:ctl.signal,cache:false});
      for(const x of Array.isArray(r)?r:[])if(essays.some(e=>e.i===Number(x.i)))
        ex.graded[Number(x.i)]={score:Number(x.score)||0,feedback:String(x.feedback||''),missing:(Array.isArray(x.missing)?x.missing:[]).map(String)};
    }catch(e){
      view.exam='paper';renderPaper();
      if(e?.code!=='cancelled')setStatus('서답형 채점에 실패했어요: '+errMsg(e),true);
      return;
    }finally{busy=null}
  }
  ex.status='done';ex.submittedAt=new Date().toISOString();
  view.exam='paper';
  await saveExam(ex);
  setStatus('');renderTabBadge();renderPaper();window.scrollTo({top:0,behavior:'smooth'});
}

$('#v-exam').addEventListener('click',e=>{
  const t=e.target;
  const chip=t.closest('.chip[data-t]');
  if(chip){const x=chip.dataset.t;S.secs=S.secs.includes(x)?S.secs.filter(u=>u!==x):[...S.secs,x];readSetup();saveLocal();renderExam();return}
  if(t.id==='u-all'){S.secs=S.secs.length===SECS.length?[]:SECS.map(x=>x.id);readSetup();saveLocal();renderExam();return}
  if(t.id==='gen')return generate();
  const it=t.closest('[data-ex]');
  if(it){cur=exams.find(x=>x.id===it.dataset.ex);if(cur){view.exam='paper';renderPaper();window.scrollTo({top:0})}return}
  if(t.closest('#back')){if(cur&&cur.status!=='done'){clearTimeout(saveT);saveExam(cur)}cur=null;view.exam='setup';renderExam();return}
  if(t.closest('#retry')){
    const ex=cur;cur={...JSON.parse(JSON.stringify(ex)),id:uid(),createdAt:new Date().toISOString(),status:'draft',answers:{},graded:{},mastered:[],title:ex.title.replace(/( \(다시\))*$/,'')+' (다시)'};
    exams.unshift(cur);saveExam(cur);renderPaper();window.scrollTo({top:0});return}
  const ch=t.closest('.choice[data-q]');
  if(ch&&cur&&cur.status!=='done'){
    const i=+ch.dataset.q,k=+ch.dataset.k;
    cur.answers[i]=cur.answers[i]===k?null:k;if(cur.answers[i]==null)delete cur.answers[i];

let similar={}; // key -> {q, answer}
function renderWrong(){
  renderTabBadge();
  const v=$('#v-wrong');const list=wrongList();
  if(!list.length){v.innerHTML=`<h2>오답노트</h2><p class="muted" style="margin:0">${exams.some(x=>x.status==='done')?'틀린 문제가 없어요. 잘했어요!':'모의고사를 제출하면 틀린 문제가 여기 모여요.'}</p>`;return}
  // 단원별 개수
  const byUnit={};for(const x of list){const u=x.q.unit||'기타';byUnit[u]=(byUnit[u]||0)+1}

    <div class="chips">${Object.entries(byUnit).sort((a,b)=>b[1]-a[1]).map(([u,n])=>`<span class="chip" style="cursor:default">${esc(u)} · ${n}</span>`).join('')}</div>
    <div class="paper">${list.map(({ex,i,q})=>{
      const key=ex.id+':'+i;const sim=similar[key];

          <button class="ghost" data-master="${esc(key)}" type="button">이제 알아요 ✓</button></div>
        ${sim?.q?simHtml(key,sim):''}</div>`}).join('<hr style="border:0;border-top:1px dashed var(--line);margin:0">')}</div>`;

function simHtml(key,sim){
  const q=sim.q,a=sim.pick;
  return `<div class="explain" style="margin-top:8px;background:#fff;border:1px solid var(--line)"><b>비슷한 문제</b>
    <div class="md">${md(q.stem)}</div>${q.data?`<div class="box plain md">${md(q.data)}</div>`:''}${q.box?`<div class="box md">${md(q.box)}</div>`:''}
    <ul class="choices" style="margin-top:8px">${q.choices.map((c,k)=>{
      let cls='';if(a!=null){if(k===q.answer)cls='right';else if(k===a)cls='wrong'}
      return `<li><button class="choice ${cls}" type="button" data-simk="${k}" data-key="${esc(key)}" ${a!=null?'disabled':''}><span class="k">${k+1}</span><span class="md">${inline(c)}</span></button></li>`}).join('')}</ul>
    ${a!=null?`<div class="explain ${a===q.answer?'ok':'bad'}" style="margin-top:8px"><span class="mark ${a===q.answer?'ok':'bad'}">${a===q.answer?'정답!':'아쉬워요'}</span> · 정답 ${CIRC[q.answer]}<div class="md">${md(q.explanation)}</div></div>`:''}</div>`;
}
$('#v-wrong').addEventListener('click',async e=>{
  const m=e.target.closest('[data-master]');
  if(m){const [id,i]=m.dataset.master.split(':');const ex=exams.find(x=>x.id===id);if(!ex)return;ex.mastered=[...(ex.mastered||[]),+i];renderWrong();saveExam(ex);return}

${RANGE_NOTE}
[틀린 문제] ${q.stem}
${q.data?'[제시문] '+q.data:''}${q.box?'\n[보기] '+q.box:''}
${q.type==='mc'?'[선택지] '+q.choices.map((c,k)=>CIRC[k]+c).join(' ')+'\n[정답] '+CIRC[q.answer]:'[모범 답안] '+q.modelAnswer}
[출력] JSON만: {"stem":"발문","data":"제시문(없으면 빈 문자열)","box":"<보기>(없으면 빈 문자열)","choices":["5개, 번호 없이"],"answer":1~5,"explanation":"해설"}

[시험 범위 자료]
${srcText(ex.secs)}`,{cache:false});
      const c=cleanExam({questions:[{...j,type:'mc',points:1}]}).questions[0];

/* ---------- 암기 ---------- */
const CARDS=(window.LIT?.cards||[]).map(([term,def,from])=>({term,def,from}));
const CARD_SRCS=['전체',...new Set(CARDS.map(c=>c.from))];
let deck=[],cardAt=0,flipped=false,deckBuilt=false;
function buildDeck(shuffle){
  const known=new Set(S.known);
  deck=CARDS.filter(c=>(S.cardSrc==='전체'||c.from===S.cardSrc)&&!(S.hideKnown&&known.has(c.term)));
  if(shuffle)for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
  cardAt=0;flipped=false;
}
function renderCards(){
  const v=$('#v-cards');
  const seg=`<div class="seg" role="group" aria-label="보기 방식">
    <button class="chip" type="button" data-mode="cards" aria-pressed="${S.cardMode!=='src'}">암기 카드</button>
    <button class="chip" type="button" data-mode="src" aria-pressed="${S.cardMode==='src'}">범위 본문 · 필기</button></div>`;
  if(S.cardMode==='src'){
    const sec=SECS.find(x=>x.id===S.srcSec)||SECS[0];
    v.innerHTML=`<div class="row"><h2>범위 본문</h2>${seg}</div>
      <div class="chips">${SECS.map(x=>`<button class="chip" type="button" data-sec="${esc(x.id)}" aria-pressed="${x.id===sec.id}">${esc(x.short)}</button>`).join('')}</div>
      <p class="note" style="margin:0"><span class="memo">빨간 글씨</span>는 수업 필기, <b>굵은 글씨</b>는 교과서에 빨간 네모 친 부분이에요.</p>
      <div class="src md" tabindex="0">${md(sec.text)}</div>`;
    return;
  }
  if(!deckBuilt){buildDeck(false);deckBuilt=true}
  const known=new Set(S.known);
  const nKnown=CARDS.filter(c=>(S.cardSrc==='전체'||c.from===S.cardSrc)&&known.has(c.term)).length;
  const nAll=CARDS.filter(c=>S.cardSrc==='전체'||c.from===S.cardSrc).length;
  const c=deck[cardAt];
  v.innerHTML=`<div class="row"><h2>암기 카드</h2>${seg}</div>
    <div class="chips">${CARD_SRCS.map(x=>`<button class="chip" type="button" data-src="${esc(x)}" aria-pressed="${x===S.cardSrc}">${esc(x)}</button>`).join('')}</div>
    <div class="row"><span class="muted">외운 카드 ${nKnown} / ${nAll}</span>
      <span><button class="ghost" id="c-hide" type="button" aria-pressed="${!!S.hideKnown}">${S.hideKnown?'외운 카드 보이기':'외운 카드 빼기'}</button>
      <button class="ghost" id="c-shuf" type="button">섞기</button></span></div>
    <div class="bar"><i style="width:${nAll?nKnown/nAll*100:0}%"></i></div>
    ${c?`<button class="card" id="c-card" type="button" aria-label="카드 뒤집기">
        <div class="from">${esc(c.from)} · ${cardAt+1} / ${deck.length}${known.has(c.term)?' · <span class="known">외움</span>':''}</div>
        <div class="term">${esc(c.term)}</div>
        ${flipped?`<div class="def">${inline(c.def)}</div>`:`<div class="hint">눌러서 뜻 보기 · 먼저 떠올려 보세요</div>`}
      </button>
      <div class="row">
        <button class="ghost" id="c-prev" type="button" ${cardAt?'':'disabled'}>← 이전</button>
        <span><button class="ghost" id="c-again" type="button">다시 볼래요</button>
        <button class="btn" id="c-know" type="button">외웠어요 ✓</button></span>
      </div>`:`<p class="muted" style="margin:0">${S.hideKnown&&nAll?'이 범위 카드를 다 외웠어요! "외운 카드 보이기"를 누르면 다시 볼 수 있어요.':'카드가 없어요.'}</p>`}`;
}
$('#v-cards').addEventListener('click',e=>{
  const t=e.target;
  const m=t.closest('[data-mode]');if(m){S.cardMode=m.dataset.mode;saveLocal();renderCards();return}
  const sc=t.closest('[data-sec]');if(sc){S.srcSec=sc.dataset.sec;saveLocal();renderCards();$('.src')?.scrollTo(0,0);return}
  const sr=t.closest('[data-src]');if(sr){S.cardSrc=sr.dataset.src;saveLocal();buildDeck(false);renderCards();return}
  if(t.closest('#c-hide')){S.hideKnown=!S.hideKnown;saveLocal();buildDeck(false);renderCards();return}
  if(t.closest('#c-shuf')){buildDeck(true);renderCards();return}
  if(t.closest('#c-card')){flipped=!flipped;renderCards();return}
  if(t.closest('#c-prev')){if(cardAt>0){cardAt--;flipped=false;renderCards()}return}
  const next=()=>{cardAt=(cardAt+1)%Math.max(deck.length,1);flipped=false};
  if(t.closest('#c-again')){
    // 모르는 카드는 조금 뒤에 다시 나오게 한다
    const c=deck.splice(cardAt,1)[0];deck.splice(Math.min(cardAt+3,deck.length),0,c);flipped=false;
    if(cardAt>=deck.length)cardAt=0;renderCards();return}
  if(t.closest('#c-know')){
    const c=deck[cardAt];if(!c)return;
    if(!S.known.includes(c.term))S.known.push(c.term);saveLocal();
    if(S.hideKnown){deck.splice(cardAt,1);if(cardAt>=deck.length)cardAt=0;flipped=false}else next();
    renderCards();return}
});

const ASK_CHIPS=['오프 스크린, 보이스 오버, 이펙트 구분법','교차 편집과 인서트 차이','숏 종류를 예시와 함께 정리해줘','미장센과 몽타주 헷갈려','S#40 시경 장면의 연출 의도','고양이 족자와 빗자루를 넣은 효과','네 갈래의 형상화 방법 비교','〈한중록〉이 드라마에 준 영향','「봄」에서 바람의 역할','반영론·표현론·효용론 구분'];
function renderChat(){
  const ch=$('#chat');ch.innerHTML='';
  if(!S.chat.length)ch.innerHTML='<p class="muted" style="margin:0">시험 범위에서 헷갈리는 용어나 장면을 물어보세요. 예시를 눌러도 돼요.</p>';
  for(const t of S.chat)ch.append(bubble(t));
  $('#ask-chips').innerHTML=S.chat.length?'':ASK_CHIPS.map(t=>`<button class="chip" type="button">${esc(t)}</button>`).join('');
}
function bubble(t){
  const d=document.createElement('div');
  if(t.role==='user'){d.className='msg me';d.textContent=t.content}
  else{d.className='msg ai md'+(t.err?' err':'');d.innerHTML=t.err?esc(t.content):md(t.content)}
  return d;
}
async function ask(text){
  text=text.trim();if(!text||busy)return;
  if(!sample){setStatus('Claude에 연결되지 않았어요. claude.ai에서 열어 주세요.',true);return}
  while(S.chat.length&&S.chat[S.chat.length-1].err)S.chat.pop();
  S.chat.push({role:'user',content:text});saveLocal();renderChat();
  const b=bubble({role:'assistant',content:''});b.innerHTML='<span class="muted">생각하는 중…</span>';$('#chat').append(b);b.scrollIntoView({block:'end',behavior:'smooth'});
  const ctl=busy=new AbortController();
  $('#ask-send').classList.add('hidden');$('#ask-stop').classList.remove('hidden');
  const hist=S.chat.filter(x=>!x.err).slice(-20);if(hist[0].role!=='user')hist.shift();
  const rules=`${TEACHER} 학생은 이 단원 지필고사를 준비 중이다. 친절하고 정확하게, 교과서와 수업 필기의 용어로 설명한다. 순서: 핵심 한 줄 → 설명(범위 자료의 해당 장면·문장을 짧게 인용) → 시험에 나올 만한 포인트와 헷갈리는 함정 → 3줄 요약. Markdown(### 소제목, **굵게**, 목록, 표)을 쓴다. 범위 자료에 없는 내용은 범위 밖이라고 밝히고 짧게만 답한다.
${RANGE_NOTE}

${EXAM_INFO}

[시험 범위 자료]
${srcText()}

아래는 학생과의 대화다.`;
  try{
    const r=await sample([{role:'user',content:rules},...hist],{signal:ctl.signal,cache:false,onText:({text})=>{b.innerHTML=md(text)}});
    S.chat.push({role:'assistant',content:r.text});
  }catch(e){
    if(e?.text&&e.code!=='refused')S.chat.push({role:'assistant',content:e.text});
    else if(e?.code!=='cancelled')S.chat.push({role:'assistant',content:errMsg(e),err:true});
  }finally{
    busy=null;saveLocal();renderChat();
    $('#ask-send').classList.remove('hidden');$('#ask-stop').classList.add('hidden');
    $('#chat').lastElementChild?.scrollIntoView({block:'end',behavior:'smooth'});
  }
}
$('#ask-chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)ask(c.textContent)});
